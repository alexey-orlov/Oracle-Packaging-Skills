problem_solution:
  problem: "Dispatchers plan technician work zones by hand, so the plan is stale before the day starts."
  solution: "The app re-optimizes zones and daily plans on the customer's own data and hands the dispatcher a plan to review."
  reframe: "Review the plan, don't build it"
  source: user:2026-09-18

one_liner:
  full: "Re-plan technician zones and daily routes on your own field-service data, and hand the dispatcher a plan to approve instead of a blank grid."
  short: "Your dispatchers approve the plan instead of building it."
  banned_words_checked: true
  source: user:2026-09-18

icp:
  line: "Field-service operations leaders at companies running Oracle Fusion Field Service with 200+ technicians"
  buyer_roles: [VP Field Service, COO]
  qualifying_signals: ["Manual zone planning", "Overtime above plan", "Technician utilization below 70%"]
  disqualifiers: ["Fewer than 50 technicians", "No digital work-order system"]
  source: user:2026-09-18

verticals:
  - name: Industrial equipment service
    framing:
      problem: "Skill-matched technicians are scarce, so a mis-assigned job costs a second visit."
      solution: "Allocation weights skills and travel together, and flags the jobs no one nearby can take."
    what_matters_here: "First-time fix rate, not raw travel time"
    worked_example: "A regional service arm re-plans 1,800 weekly work orders across 14 zones."
    status: plausible

capabilities:
  - area: Allocation rules
    customization_scope_area: "Rule weights and the constraint set, per customer"
    categories:
      - name: Availability
        features:
          - name: Technician availability and skills constraints
            status: available
            customization_scope: "Rule weights and constraint set per customer"
            specificity: [use_case]
            tier_first_available: pov
            source: feature-list 2026-07-17

workflow:
  inputs:
    - { system: Oracle Fusion Field Service, data: work orders, technicians, zones }
  steps:
    - n: 1
      name: Ingest and validate demand
      actor: system
      human_in_the_loop: false
      failure_path: "Missing fields flag the row, they never drop it; the dispatcher resolves"
    - n: 2
      name: Optimize zones and daily plan
      actor: ai
      human_in_the_loop: false
      failure_path: "No feasible plan returns the previous plan plus the broken constraints"
    - n: 3
      name: Review and approve
      actor: human
      human_in_the_loop: true
      failure_path: "An edited plan is re-checked before write-back"
  outputs:
    - { system: Oracle Fusion Field Service, data: approved plan written back }

architecture:
  inputs: [work orders, technician roster, zone geometry]
  stack:
    - { layer: Custom configuration, vendor: SoftServe, items: [rule weights, review UI] }
    - { layer: Accelerator business app, vendor: Oracle + SoftServe, items: [planning app] }
    - { layer: Optimization engine, vendor: NVIDIA, items: [NVIDIA cuOpt], catalog_id: nvidia-cuopt }
    - { layer: Infrastructure, vendor: Oracle, items: [OCI compute with GPUs, Object Storage] }
  outputs: [approved plan, plan telemetry]

oracle_products:
  - id: oci-gpu-instances
    role: required
    why: "Runs the optimization engine"
  - id: oracle-fusion-field-service
    role: required
    why: "Source of work orders and destination of the approved plan"
    integration: { pov: "file export / import", integration: "API write-back", scaling: "API + telemetry" }
  - id: oci-object-storage
    role: optional
    why: "Landing zone for demand forecasts"

kpis:
  - name: Planning cycle time
    formula: "Time from demand freeze to approved plan"
    baseline: "~2 days manual"
    figure: "~30 min"
    figure_status: pov_result
    attribution:
      named_when_allowed: "Proof of value"
      otherwise: "proof of value at a global home-appliance manufacturer"
    caveat: "Illustrative proof-of-value result, not contractual"
    source: pov-report 2026-06-30

