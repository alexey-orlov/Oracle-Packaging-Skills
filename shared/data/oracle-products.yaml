# Oracle + NVIDIA product catalog for the accelerator packs.
# One distilled source of canonical names. Every pack picks its required and
# optional products from here, by `id`, so products are named and aggregated
# identically across packs, artifacts and channels.
#
# required = the pack is built on it, or fully relies on it.
# optional = could logically be used with it, as an additional data source or
#            destination system.
#
# Names were verified against the vendor's own live product page on the
# `fetched` date below. Re-verify before shipping: Oracle is mid-rebrand
# (AI World 2025 wave) and page names move.

version: 2026-09-18
fetched: 2026-09-18
vendors: [Oracle, NVIDIA]

naming_rules:
  - "Write the vendor's current page name verbatim. Every `name` in this file was taken from the vendor's own H1 or <title> on the `fetched` date; re-verify before shipping."
  - "Oracle AI Data Platform — never 'AIDP' in anything a partner or customer reads. Fine as internal shorthand only; Oracle uses the abbreviation nowhere in customer-facing copy."
  - "Oracle Autonomous AI Lakehouse — not 'Oracle AI Lakehouse', not 'Autonomous Data Warehouse'. The old /autonomous-data-warehouse/ URL 301-redirects to it."
  - "Oracle Autonomous AI Database — not 'Autonomous Database'. '26ai' is a version, not a product; never write it as a product name on its own."
  - "Oracle Fusion Field Service — not 'Oracle Field Service'. Oracle's own page H1 carries 'Fusion'; the short form is informal and drifts across our artifacts."
  - "Oracle AI for Fusion Applications (the umbrella) / Oracle AI Agent Studio for Fusion Applications (the build surface) — never 'Oracle Fusion AI', never 'Fusion AI Studio'."
  - "NVIDIA NeMo Agent Toolkit and NVIDIA AI-Q Blueprint — write both as the vendor does. NVIDIA NeMo is the umbrella; NVIDIA AI Enterprise is the commercial platform sold on OCI Marketplace."
  - "Keep the vendor prefix on NVIDIA components: 'NVIDIA cuOpt', not 'cuOpt' or 'cuOpt on OCI'."
  - "No joint Oracle+NVIDIA brand exists. oracle.com/cloud/nvidia/ is a campaign page, not a SKU — a stack row naming one thing has to pick a side of the '+'."
  - "OCI is the only accepted abbreviation. Spell out every other product on first use; no ODA, no OIC, no OAC, no OFS in external copy."
  - "Oracle asks partners not to put Oracle marks inside a product or service name — the pack's own name never contains 'Oracle'."
  - "OCI service pages drop the 'OCI' prefix in the H1 (H1 'Object Storage'); the service name still carries it. Write 'OCI Object Storage'."

