          - { name: Workload Balance, status: available, tier_first_available: pov, specificity: [], source: feature-list-2026-09-10 }
      - name: Baseline comparison
        note: "No status cell of its own; the merged `●` from the KPI category covers it."
        features:
          - { name: Compare baseline vs optimized allocation, status: available, tier_first_available: pov, specificity: [], source: feature-list-2026-09-10 }

  - area: Integrations
    stage: Load the period's data
    customization_scope_area: "Integration configuration · Custom integrations"
    categories:
      - name: Integrations
        note: >-
          Status cell `○` roadmap — correct for the pack's own shipped code, and NOT a contradiction
