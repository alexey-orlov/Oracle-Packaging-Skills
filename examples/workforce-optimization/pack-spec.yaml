# Workforce Optimization — worked example of a pack spec.
#
# This file reproduces the DELIVERED Workforce Optimization artifacts (sales one-pager,
# sales deck, feature list, executive summary, mini-site listing, interactive demo) in the
# schema of shared/schema/pack-spec.md, with the 2026-09-18 decisions applied on top. It is
# the acceptance fixture for the builder skills and a reading model for /oracle-packs:spec.
#
# It is NOT a signed-off spec. status is `draft` and stays `draft` until the pack owner walks
# it through /oracle-packs:spec: the four first-order components (problem_solution, one_liner,
# icp, name) carry artifact sources here, and the schema requires a `user:` source on each of
# them before `status: confirmed`. See `open_questions` for everything still unconfirmed.
#
# Source tokens used in every `source:` field are defined in `provenance.inputs[].id`.
# Inferences are marked `(inferred)` in the text they qualify.

meta:
  slug: workforce-optimization
  name: Workforce Optimization
  name_source: one-pager-2026-07-17, decisions-2026-09-18   # artifact-sourced; `user:<date>` only after sign-off
  name_variants:
    site: Workforce Optimization
    internal_slide: Workforce Optimization App
    external: Workforce optimization
    external_subheading: Accelerator App by SoftServe
    note: >-
      Rule from decisions-2026-09-18. The live mini-site currently ships the sentence-case
      "Workforce optimization" as `name`; it is relabelled at the next site rebuild.
    source: decisions-2026-09-18
  roadmap_item_id: workforce-optimization
  roadmap_block: Data analysis & optimization
  source_engagement:
    # The delivery customer's name is deliberately NOT written in this repo — see the repo's
    # rules of the repo and shared/tools/denylist.txt. A real pack spec carries it here, under
    # clearance.customer_name_allowed; this worked example carries the descriptor instead.
    customer: "<the delivery customer — a global home-appliance manufacturer>"
    delivered: >-
      Work-zone optimization PoC: NVIDIA cuOpt on OCI computing technician-to-zone allocations
      from the customer's own historical field-service data, with dispatcher approval in the
      loop. File-based in and out (XLSX upload, file export); no Oracle Fusion Field Service
      integration. Results modeled from 12 simulations across three countries. Three months.
    divergence_line: >-
      The pack generalizes the allocation rules the proof of value hard-coded; system integration
      and the feedback loop are Integration-tier scope.
    divergence_from_pack: >-
      The pack generalizes what the PoC hard-coded. Business logic — allocation rules,
      constraints, KPI formulas, forecasting — was written for one customer and is per-client
      configuration in the pack; the dispatcher UI and approval workflow are the reusable core.
      The PoC ran file-based with a limited rule set, which is exactly the PoV Jumpstart tier;
      Oracle Fusion Field Service integration, additional data sources and the feedback loop are
      sold as Integration-tier scope and were not delivered. Distance-based (zoneless) planning
      is a separate future product, not a gap in this pack.
    source: spec-doc-2026-09-16, call-2026-07-07, site-2026-09-17
  status: draft
  spec_version: 1
  generated_with: { roadmap_version: 2026-09-18, catalog_version: 2026-09-18 }   # the `generated:` / `version:` lines of shared/data/

clearance:
  customer_name_allowed:
    internal: true
    partner_print: false                # approval pending with Alex — see open_questions
    customer_site: false                # granted 2026-09-14, withdrawn 2026-09-16
    demo: false
  anonymized_descriptor: a global home-appliance manufacturer
  internal_only_facts:
    - named customer accounts and logos
    - contract values and per-engagement pricing beyond the published PoV price
    - the customer's service-zone geography, zone-naming convention and zone counts
    - technician identifiers and per-technician uplifts above the cleared median
    - headcount, POD and capacity numbers
    - the roadmap ceiling and any "gap" statement
  approvals: []
  source: site-2026-09-17, decisions-2026-09-18

problem_solution:                        # component 1
  problem: >-
    Field-service operators plan their mobile workforce by hand: work zones, technician
    assignments, dozens of rules and constraints.
  problem_points:                         # the three sub-problems the print artifacts bullet
    - label: Suboptimal efficiency
      text: uneven workloads and under-used capacity
    - label: Lower customer satisfaction
      text: longer wait times from suboptimal allocations
    - label: Poor scalability
      text: "planning hinges on scarce senior dispatchers; new zones launch slowly"
  solution: >-
    NVIDIA cuOpt ingests demand, availability, skills and constraints, and computes the best
    technician-to-zone-to-job plan in minutes. Dispatchers review it on a live map, re-optimize
    and write the plan back to Oracle Fusion Field Service.
  outcome_chips: ["Productivity ↑", "Capacity utilization ↑", "Customer wait time ↓"]
  reframe: "Review the plan, don't build it"
  source: one-pager-2026-07-17

one_liner:                               # component 2
  full: >-
    Optimizes field-service work zones and schedules with NVIDIA cuOpt: a region's four-week plan,
    built in minutes and approved by dispatchers.
  short: "A region's four-week field plan, optimized in minutes and approved by dispatchers."
  banned_words_checked: true
  note: >-
    `full` is the mini-site's `oneLiner` and is the canonical product one-liner; `short` is its
    rep-sayable `shortLine`. The one-pager hero line it replaces ("…packaged from proof of value
    to enterprise scale") was rejected by the owner: a one-liner states the job and the outcome,
    never how we package it (naming-and-clearance §4, asserted as ART206 on every channel). The
    vendor name is the catalog's — the site still writes "Oracle Field Service" and is relabelled
    at the next rebuild. The delivered sales deck cover carries a third, deck-scoped line ("AI
    accelerator service packages on Oracle OCI + NVIDIA cuOpt…") that describes the deck rather
    than the product; it is retired at the deck's next rebuild.
  source: site-2026-09-17, decisions-2026-09-18

icp:                                     # component 3
  line: "Any mobile field force planned against skills, availability and geography."
  buyer_roles: [VP Field Service, Head of Service Operations, Head of Dispatch, COO]
  qualifying_signals:
    - "Zone-based planning: technicians are allocated to geographic work zones, not routed job by job"
    - "A heavy, centralized dispatch and scheduling routine run by a small number of senior dispatchers"
    - "Oracle Fusion Field Service, or an equivalent field-service management system, as the system of record"
    - "A recurring planning horizon of two or more weeks (roster mode), with bookings already on the calendar"
    - "More than one region or market, with rules that differ between them"
  disqualifiers:
    - "Distance-based (zoneless) planning — a separate future product, not this pack"
    - "Within-day dynamic dispatch as the primary need — on the roadmap, not in the pack today"
    - "Jobs that routinely require two or more technicians on site (out of the delivered PoC's scope)"
    - "No historical planning data the customer can hand over for a proof of value"
  note: >-
    `line` is the only clean customer-side ICP sentence in the delivered estate (the one-pager's
    nearest equivalent is filed under partner value and gates on owning Oracle Fusion Field
    Service). Qualifying signals and disqualifiers are internal and reach no external artifact.
  source: site-2026-09-17, call-2026-07-07, spec-doc-2026-09-16

verticals:                               # component 5
  - name: Residential appliance & white-goods repair
    site_label: Manufacturing
    framing:
      problem: >-
        In-home repair of manufactured goods is planned by hand: work zones and technician
        allocations, region by region, juggling skills, spare parts, travel and absences. Urgent
        call-outs and no-shows mean re-planning the day.
      solution: >-
        The solver plans the whole region against skills, parts, travel and existing bookings at
        once, and the dispatcher reviews and approves the result. Rules that differ by market —
        working time, holidays, service commitments — are configuration, so setting up a new
        region is a configuration job.
    what_matters_here: >-
      Dispatch home-repair technicians by skill, spare parts and travel, absorbing urgent
      call-outs and no-shows without re-planning the day.
    worked_example: >-
      The delivered proof of value: a residential appliance-repair field force across three
      countries, planned on postcode-based work zones, optimized and approved by its own
      dispatchers. Anonymized as "a global home-appliance manufacturer" outside internal use.
    status: proven
    source: deck-2026-07-13, site-2026-09-17

  - name: Utilities — water · gas · electric
    site_label: Utilities
    framing:
      problem: >-
        Water, gas and electric crews are scheduled across service territories against SLAs, crew
        certifications and outage spikes. Planned and emergency work compete for the same
        capacity, and the balance is struck manually by a handful of senior dispatchers.
      solution: >-
        Territories, certifications and SLA commitments become weighted constraints, and the plan
        is re-solved as the day's demand changes. Planned and emergency work are balanced against
        the objectives you weight, and no allocation reaches a crew until a dispatcher approves it.
    what_matters_here: >-
      Schedule field crews across service territories against SLAs, outage spikes and crew
      certifications, balancing planned and emergency work.
    worked_example: "-"
    status: plausible
    source: deck-2026-07-13, site-2026-09-17

  - name: Telecom & cable
    site_label: Telecom & cable
    framing:
      problem: >-
        Install-and-repair technicians have to be routed to tight appointment windows across
        regions, matched to line skills. Missed windows cost customer satisfaction directly, and
        launching a new service zone depends on scarce planning expertise.
      solution: >-
        Appointment windows and line skills are modeled as commitment and skill rules, and the
        solver routes against them while minimizing travel. Launching a new zone comes down to a
        configuration change.
    what_matters_here: >-
      Route install-and-repair technicians to tight appointment windows across regions, matching
      line skills and cutting customer wait time.
    worked_example: "-"
    status: plausible
    source: deck-2026-07-13, site-2026-09-17

  - name: Industrial · medical-device · IT equipment service
    site_label: Healthcare
    framing:
      problem: >-
        Medical-device and equipment service engineers are allocated to contracted assets by
        skill, SLA and location. Uptime on high-value machines is contractual, and the allocation
        is worked out by hand against a rising number of installed assets.
      solution: >-
        Contracted SLAs, engineer certifications and asset locations become the constraint set the
        solver works against, with uptime-critical commitments weighted as hard rules. The KPI
        readout compares the current and the optimized plan on identical definitions.
    what_matters_here: >-
      Allocate asset-based service engineers to contracted equipment by skill, SLA and location,
      keeping high-value machines uptime-critical.
    worked_example: "-"
    status: plausible
    source: deck-2026-07-13, site-2026-09-17

capabilities:                            # component 6 — Area > Category > Feature
  # The delivered feature list (feature-list-2026-09-10) carries `Current status` merged down per
  # CATEGORY and `Standard customization scope` merged down per AREA. Feature-level `status` below
  # therefore inherits its category's cell — see each category's `note` — and feature-level
  # `customization_scope` is deliberately unset; the area-level text is the real granularity.
  # Glyph mapping applied per decisions-2026-09-18: `●` #1485C3 -> available, `●` #C1E4F5 ->
  # partial (rendered `◐` from now on), `○` #AEB4BA -> roadmap.

  - area: Allocation rules
    stage: Set the rules
    customization_scope_area: >-
      Custom rules implementation · Rules configuration · Matching rules with source data formats ·
      Balancing optimization function with penalty / rewards, allocation rules weights tuning to
      achieve optimal allocation per customer · Introduction of additional optimization objectives
    categories:
      - name: Workforce availability rules
        note: "Status cell `●` available, merged across all four features."
        features:
          - { name: Skill-based allocation, status: available, tier_first_available: pov, specificity: [], source: feature-list-2026-09-10 }
          - { name: Maximal load per day, status: available, tier_first_available: pov, specificity: [], source: feature-list-2026-09-10 }
          - { name: Planned vacation reallocation, status: available, tier_first_available: pov, specificity: [], source: feature-list-2026-09-10 }
          - { name: Same-day sickness handling, status: available, tier_first_available: pov, specificity: [], source: feature-list-2026-09-10 }
      - name: Distance-based
        note: "Status cell `○` roadmap. No tier carries these; zoneless planning is a separate future product."
        features:
          - { name: Maximal distance / travel time rules, status: roadmap, specificity: [use_case], source: feature-list-2026-09-10 }
          - { name: Real-time traffic / live travel data, status: roadmap, specificity: [use_case], source: feature-list-2026-09-10 }
      - name: Dynamic
        note: "Status cell `○` roadmap. Urgent / emergency handling is named in the Integration tier's advanced-allocation cell."
        features:
          - { name: Within-day job reassignment, status: roadmap, specificity: [use_case], source: feature-list-2026-09-10 }
          - { name: Urgent / emergency request handling, status: roadmap, tier_first_available: integration, specificity: [use_case], source: feature-list-2026-09-10, deck-2026-07-13 }
      - name: Workzone-based rules
        note: "Status cell `●` available, merged across all four features. The pack's defining use case."
        features:
          - { name: Default work zones per technician, status: available, tier_first_available: pov, specificity: [use_case], source: feature-list-2026-09-10 }
          - { name: Work zone-level demand, status: available, tier_first_available: pov, specificity: [use_case], source: feature-list-2026-09-10 }
          - { name: Neighboring workzones, status: available, tier_first_available: pov, specificity: [use_case], source: feature-list-2026-09-10 }
          - { name: Cross-zone allocation of selected technicians, status: available, tier_first_available: pov, specificity: [use_case], source: feature-list-2026-09-10 }
      - name: Forecast-based rules
        note: "Status cell `●` available. The customer supplies the forecast; the pack does not produce it."
        features:
          - { name: Forecast-based allocation (forecast data to be provided), status: available, tier_first_available: pov, specificity: [customer], source: feature-list-2026-09-10 }
      - name: Commitment-based rules
        note: >-
          Status cell is the pale `●` = partially implemented out of the box, major improvements on
          the roadmap. Rendered `◐` from now on. The delivered docx also hangs a `***` footnote
          marker on "Non-movable appointments" whose footnote text is missing from the file.
        features:
          - { name: Non-movable appointments, status: partial, tier_first_available: pov, specificity: [], footnote_marker: "***", source: feature-list-2026-09-10 }
          - { name: Different SLA types per appointment, status: partial, tier_first_available: integration, specificity: [customer], source: feature-list-2026-09-10, deck-2026-07-13 }
      - name: Other rules
        note: "Status cell `○` roadmap. Crews and inventory-coupling are named in the Integration tier's advanced-allocation cell."
        features:
          - { name: Spare-parts availability, status: roadmap, tier_first_available: integration, specificity: [industry], source: feature-list-2026-09-10, deck-2026-07-13 }
          - { name: Crew-based assignments, status: roadmap, tier_first_available: integration, specificity: [industry], source: feature-list-2026-09-10, deck-2026-07-13 }
          - { name: Other custom rules, status: roadmap, tier_first_available: integration, specificity: [customer], source: feature-list-2026-09-10 }
      - name: Optimization function & rule weights
        note: "Status cell `●` available, merged across all three features."
        features:
          - { name: "Multi-objective optimization (productivity, waiting time, workload balance)", status: available, tier_first_available: pov, specificity: [engine], source: feature-list-2026-09-10 }
          - { name: Allocation rules weighting (hard / soft), status: available, tier_first_available: pov, specificity: [engine], source: feature-list-2026-09-10 }
          - { name: Minimal disruption of current allocation, status: available, tier_first_available: pov, specificity: [engine], source: feature-list-2026-09-10 }

  - area: Review and approval workflow
    stage: Review, approve, measure
    customization_scope_area: >-
      Model decisions explanations / recommendations tuning to match custom allocation rules
    categories:
      - name: Review
        note: "Status cell `●` available. The most reusable part of the delivered product (call-2026-07-07)."
        features:
          - { name: "Dispatcher UI (map, table views)", status: available, tier_first_available: pov, specificity: [], source: feature-list-2026-09-10 }
          - { name: Dispatcher approval/rejection, status: available, tier_first_available: pov, specificity: [], source: feature-list-2026-09-10 }
          - { name: Model decisions explanation and recommendations, status: available, tier_first_available: pov, specificity: [engine], source: feature-list-2026-09-10 }
      - name: Feedback loop
        note: "Status cell `○` roadmap. Sold as Integration-tier scope: the one-pager's re-optimization row is `—` at PoV."
        features:
          - { name: Iterative feedback-based re-optimization, status: roadmap, tier_first_available: integration, specificity: [], source: feature-list-2026-09-10, one-pager-2026-07-17 }
          - { name: Human-feedback-driven model tuning, status: roadmap, tier_first_available: integration, specificity: [engine], source: feature-list-2026-09-10 }
          - { name: Alternative allocation options (what-if), status: roadmap, tier_first_available: integration, specificity: [engine], source: feature-list-2026-09-10 }

  - area: KPIs and analytics
