open_questions:
  - "Customer name on partner-print artifacts: `clearance.customer_name_allowed.partner_print` is false here, but the delivered one-pager, deck, executive summary and section deck all print the customer's name and logo. Alex has not confirmed whether that approval stands. Until he does, every builder emits the anonymized descriptor and the delivered artifacts are out of compliance with their own spec."
  - "Two figure sets for one pack. The print artifacts carry ~30 min / up to +26% / €190K per month; the mini-site carries the anonymized, modeled set (+4.5% median jobs per technician per day, ~5x three-year return, 83% of 12 simulations positive, 15–20% dispatcher productivity, no € figures). decisions-2026-09-18 says one metric set per pack, so one of the two has to go. This spec carries the one-pager set; the site set is not reproduced here."
  - "`figure_status` for the €190K/month figure. The one-pager types it as an estimate at full launch, so it is recorded as `modeled`, not `pov_result`. Confirm."
  - "Scaling-tier pricing is `tbd` on every artifact. Services and infrastructure both need a number or an explicit \"scoped per engagement\" line."
  - "Target OCI consumption per tier was committed on the 2026-07-09 offering-deck review and never added to an artifact. Recorded as \"-\"."
  - "The `***` footnote marker on \"Non-movable appointments\" in the delivered feature-list docx has no footnote text in the file. What did it say?"
  - "The four optional Oracle products are inferred from the pack's integration list, not sourced from any artifact. Confirm or replace."
  - "Catalog ids were reconciled against shared/data/oracle-products.yaml (version 2026-09-18): every id here now resolves. Three had no catalog entry and use the closest catalogued product — `oci-dedicated-ai-cluster` for the GPU cluster, `oci-vcn` for networking, and one merged `oracle-fusion-cloud-scm` entry where the example had separate inventory and demand-management ids. All three are logged as catalog change requests in shared/data/oracle-products.README.md; the catalog owner decides whether to split them out. Details in this folder's README.md."
  - "`meta.source_engagement.delivered` carries no delivery window. The mini-site case study says three months; the exact start and end dates are not in any source read here."
  - "Vertical labels: three different four-item lists exist (deck and feature list · mini-site generic industries · the productization workbook's Sheet3). This spec carries the deck labels with the site labels alongside; confirm which set is canonical for new artifacts."
  - "Feature-level customization scope is unset by design — the delivered feature list scopes customization per AREA, and only `customization_scope_area` is filled. If the schema wants a feature-level value, it needs a source that does not exist today."
  - "Feature-level `status` inherits the category's merged cell; the source has no per-feature granularity. Same question for the schema."
  - "`specificity` tags are set only where the 2026-07-07 standard-vs-custom session supports them; everything else is `[]` rather than guessed. The full four-axis pass has not been run for this pack."
  - "`vertical_differences` is filled only for workflow step 2 (Set the rules), which is the one step the vertical framings actually speak to. Steps 1, 3 and 4 are \"-\" for three of the four verticals."
  - "Resolved in the schema, left here so the decision is visible: a KPI that is defined and measured per engagement but has no cleared headline figure is written `figure: \"-\"` (and `figure_status: \"-\"`), and needs no `attribution` — the enum did not need a fifth value, because `-` already means 'deliberately empty' everywhere in a spec. Four of the seven KPIs here sit in that state and keep their formula, baseline and caveat. What is still open is whether any of the four gets a cleared figure for the next artifact round."
  - "`meta.name_variants.site` is Title Case per decisions-2026-09-18; the live listing ships sentence case. Which wins at the next site rebuild?"
