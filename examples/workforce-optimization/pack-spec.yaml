          system integration below is Integration-tier scope. State the tier with every claim.
        features:
          - { name: Oracle Fusion Field Service as a datasource / destination, status: roadmap, tier_first_available: integration, specificity: [], oracle_product: oracle-fusion-field-service, source: feature-list-2026-09-10, one-pager-2026-07-17 }
          - { name: Demand forecasting datasource, status: roadmap, tier_first_available: integration, specificity: [customer], source: feature-list-2026-09-10 }
          - { name: Visits booking system, status: roadmap, tier_first_available: integration, specificity: [customer], source: feature-list-2026-09-10 }
          - { name: Inventory system for spare-parts availability, status: roadmap, tier_first_available: integration, specificity: [industry], source: feature-list-2026-09-10 }
          - { name: HRM system for people availability, status: roadmap, tier_first_available: integration, specificity: [], source: feature-list-2026-09-10 }
          - { name: BI system for KPIs / analytics exports, status: roadmap, tier_first_available: integration, specificity: [customer], source: feature-list-2026-09-10 }

workflow:                                # component 7
  inputs:
    - system: Oracle Fusion Field Service
      data: "work orders and bookings, technicians with skills and home postcode, work zones and their postcodes, technician calendars with day status and capacity"
      tier: "PoV Jumpstart: exported to XLSX by the customer. Integration: API."
    - system: Customer demand forecast
      data: "forecast volumes per zone and period, supplied by the customer"
      tier: "PoV Jumpstart: file. Integration: source system."
  steps:
    - n: 1
      name: Load the period's data
      actor: human
      human_in_the_loop: true
      description: >-
        The dispatcher selects a region and a planning period of up to four weeks and loads the
        period's data: demand, technician availability, skills, work zones and existing bookings.
      failure_path: >-
        Validation names the missing sheet or field rather than failing silently; the row is
        flagged, not dropped, and the dispatcher fixes the input and re-runs. A warning does not
        block the run.
      vertical_differences:
        Residential appliance & white-goods repair: "-"
        Utilities — water · gas · electric: "-"
        Telecom & cable: "-"
        Industrial · medical-device · IT equipment service: "-"
      source: spec-doc-2026-09-16, site-2026-09-17, demo-2026-09-16
    - n: 2
      name: Set the rules
      actor: human
      human_in_the_loop: true
      description: >-
        Zone, forecast and commitment rules are configured, then weighted as hard or soft
        constraints against the objectives that matter — productivity, waiting time, workload
        balance — with minimal disruption of the current allocation as a standing objective.
      failure_path: >-
        A constraint set that makes the period infeasible is surfaced before the solve, and a hard
        rule is relaxed to soft only with the dispatcher's agreement (inferred — no delivered
        artifact states the infeasibility path).
      vertical_differences:
        Residential appliance & white-goods repair: "Working time, holidays and service commitments differ by market and are configuration, so a new region is a configuration job."
        Utilities — water · gas · electric: "Territories, crew certifications and SLA commitments become weighted constraints; planned and emergency work are balanced against the weights."
        Telecom & cable: "Appointment windows and line skills are modeled as commitment and skill rules; travel is minimized against them."
        Industrial · medical-device · IT equipment service: "Contracted SLAs, engineer certifications and asset locations form the constraint set, with uptime-critical commitments weighted as hard rules."
      source: site-2026-09-17, feature-list-2026-09-10
    - n: 3
      name: Solve the plan
      actor: ai
      human_in_the_loop: false
      description: >-
        NVIDIA cuOpt computes the technician-to-zone-to-job plan against every constraint at once
        on the GPU solver, after a travel matrix is built and the rules and objectives are loaded.
        Minutes rather than days; up to about 20 minutes on a full region in the delivered product.
      failure_path: >-
        A solver timeout or an infeasible model returns the current plan unchanged with the
        blocking constraint named, rather than a partial plan (inferred).
      vertical_differences:
        Residential appliance & white-goods repair: "-"
        Utilities — water · gas · electric: "-"
        Telecom & cable: "-"
        Industrial · medical-device · IT equipment service: "-"
      source: spec-doc-2026-09-16, demo-2026-09-16
    - n: 4
      name: Review, approve, measure
      actor: human
      human_in_the_loop: true
      description: >-
        The dispatcher compares the current and the optimized plan on a live map, drills into a
        zone or a technician, and approves, rejects or comments per zone in the Zone View. KPIs are
        shown before and after on identical definitions. Re-running with feedback is an
        Integration-tier capability.
      failure_path: >-
        A rejected zone keeps its current allocation; nothing is exported until the dispatcher
        approves, so a bad plan never reaches the field.
      vertical_differences:
        Residential appliance & white-goods repair: "-"
        Utilities — water · gas · electric: "No allocation reaches a crew until a dispatcher approves it."
        Telecom & cable: "-"
        Industrial · medical-device · IT equipment service: "The KPI readout compares the current and the optimized plan on identical definitions."
      source: spec-doc-2026-09-16, site-2026-09-17, demo-2026-09-16
  outputs:
    - system: Oracle Fusion Field Service
      data: "optimized allocations — zones and visits — with the dispatcher's decisions and comments"
      tier: "PoV Jumpstart: file export. Integration: API write-back. Scaling: API plus telemetry."
    - system: BI
      data: "KPIs per plan version"
      tier: "Integration"
  source: spec-doc-2026-09-16, site-2026-09-17, one-pager-2026-07-17

architecture:                            # component 8
  inputs:
    - system: Oracle Fusion Field Service
      data: "technicians, availability, bookings, default allocations"
    - system: Additional data sources
      data: "booking, parts inventory, HR/WFM, demand forecast (Integration tier)"
  stack:
    - layer: Custom configuration
      vendor: SoftServe
      items: ["Client allocation rules and constraints", "KPI definitions and formulas", "Data integrations and mappings"]
    - layer: Accelerator business app
      vendor: Oracle + SoftServe
      name: Accelerator business app
      summary: optimization engine wrapper and dispatcher UI
      items: ["Optimization engine wrapper and dispatcher UI", "Approval workflow and re-solve loop", "KPI and analytics layer"]
    - layer: Optimization engine
      vendor: NVIDIA
      name: NVIDIA cuOpt
      summary: GPU-accelerated solver
      items: [NVIDIA cuOpt — GPU-accelerated solver]
      catalog_id: nvidia-cuopt          # NVIDIA, not an Oracle product — carried here, not in oracle_products
    - layer: Infrastructure
      vendor: Oracle
      catalog_id: [oci-dedicated-ai-cluster, oci-kubernetes-engine, oci-object-storage, oracle-autonomous-ai-database, oci-vcn, oci-iam]   # the platform's services, by catalog id; the platform itself is `oci` in oracle_products
      label: "Oracle · OCI dedicated AI cluster, Object Storage, IAM"
      items:
        - "OCI dedicated AI cluster, 4–8 NVIDIA A100 GPUs"
        - "OCI Object Storage for the period's data"
        - "OCI networking and IAM"
        - "OKE / containers and Oracle Database 26ai for persistence (delivered PoC scope; not shown on the published architecture diagrams)"
  outputs:
    - system: Oracle Fusion Field Service
      data: "optimized allocations: zones and visits"
    - system: BI
      data: "KPIs per plan version"
    - system: Plan export
      data: "the approved plan with the dispatcher's decisions and comments (18 columns in the delivered product)"
  note: >-
    The one-pager's `.arch` diagram is the canonical compact form (source system left, OCI box
    right, two labelled pipes); deck slide 7 is the canonical detailed form. The four-rung ladder
    above is the attribution device used on the executive summary and the section deck, and is a
    different component from the data flow.
  source: one-pager-2026-07-17, deck-2026-07-13, site-2026-09-17, spec-doc-2026-09-16

oracle_products:                         # components 9 and 10 — catalog ids, Oracle-vendor only
  #
  # Every id below resolves to shared/data/oracle-products.yaml (catalog version 2026-09-18).
  # NVIDIA cuOpt is NOT here: it is the pack's engine and is named in architecture.stack[].catalog_id.
  # Required is the platform alone (owner's rule, 2026-09-22): the seven required entries of the
  # 2026-09-18 version — Fusion Field Service, the dedicated AI cluster, Object Storage, VCN, IAM,
  # OKE, Autonomous AI Database — collapse into `oci`, the services staying in architecture.stack[],
  # and Fusion Field Service moves to optional as the typical source and destination.
  # Three ids this example first coined have no catalog entry and are logged as catalog change
  # requests in shared/data/oracle-products.README.md; each uses the closest catalogued product.
  #
  # NOTE ON `role: optional`. No delivered WfO artifact lists optional Oracle products as such —
  # the component has no reference in the estate (component-map-2026-09-17 §4). The three inferred
  # `optional` entries below (HCM, SCM, Analytics) come from the pack's own named integration list (booking,
  # inventory, HR/WFM, demand forecasting, BI) mapped onto the Oracle products that would serve
  # them; the booking system has no Oracle counterpart and stays customer-specific. All three
  # need the owner's confirmation — see open_questions.
  #
  - id: oci
    role: required
    why: >-
      The platform: a dedicated AI cluster of 4–8 NVIDIA A100 GPUs (A10 in the delivered PoC) runs
      the NVIDIA cuOpt solver, Kubernetes runs the app and the pre/post-processing services,
      Object Storage holds the period's data, Autonomous AI Database keeps plan versions, decisions
      and KPI history, VCN and IAM carry networking and identity — each in the Infrastructure layer's catalog_id list
    note: >-
      Until 2026-09-22 these were seven required entries (oracle-fusion-field-service,
      oci-dedicated-ai-cluster — first coined as oci-compute-gpu —, oci-object-storage, oci-vcn —
      first coined as oci-networking —, oci-iam, oci-kubernetes-engine,
      oracle-autonomous-ai-database). OKE and the database come from the delivered PoC's technical
      scope and sit on no published diagram.
    source: one-pager-2026-07-17, deck-2026-07-13, site-2026-09-17, spec-doc-2026-09-16
  - id: oracle-fusion-field-service
    role: optional
    why: "The typical source of work orders, technicians, zones and bookings, and destination of the approved plan — the delivered case's system; a buyer on another field-service system connects that one instead"
    integration:
      pov: "File export / import — the customer exports XLSX and imports the optimized plan"
      integration: "API write-back: in — staff, availability, booking data; out — optimized allocations (zones, visits); back — factual durations and times"
      scaling: "API plus telemetry, multi-region"
    name_note: >-
      Canonical vendor name is "Oracle Fusion Field Service" (the Jul-17 one-pager). The deck, the
      feature list and the mini-site still say "Oracle Field Service"; relabel at next rebuild.
    note: "Moved from required to optional on 2026-09-22: the pack reads from and writes to it; it does not run on it."
    source: one-pager-2026-07-17, site-2026-09-17
  - id: oracle-fusion-cloud-hcm
    role: optional
    why: "Could be the HR/WFM source for people availability, one of the five typical Integration-tier integrations"
    inferred: true
    catalog_note: >-
      The example first coined `oracle-fusion-hcm`; the catalog's id is `oracle-fusion-cloud-hcm`
      (Workforce Management is a module inside it — name the module when a pack depends on one).
    source: one-pager-2026-07-17, deck-2026-07-13
  - id: oracle-fusion-cloud-scm
    role: optional
    why: >-
      Could be the inventory source for spare-parts availability and the demand-forecast source the
      forecast-based allocation rules consume
    inferred: true
    catalog_note: >-
      The example first coined two ids, `oracle-fusion-inventory-management` and
      `oracle-fusion-demand-management`. The catalog carries neither: both are modules of Fusion SCM,
      so the two entries collapse into one. Logged as a catalog change request — if the catalog ever
      splits the modules out, this entry splits with it.
    source: deck-2026-07-13
  - id: oracle-analytics-cloud
    role: optional
    why: "Could be the BI destination for KPIs per plan version"
    inferred: true
    source: feature-list-2026-09-10, deck-2026-07-13

kpis:                                    # component 11 — ONE metric set per pack
  # The set below is the sales one-pager's set (decisions-2026-09-18: one metric set per pack,
  # taken from the customer study; attribution varies by approval and channel, figures do not).
  # The mini-site currently ships a different, anonymized, modeled set — see open_questions.
  - name: Planning cycle time
    kind: business
    owner_role: VP Field Service
    formula: "Elapsed time to optimize and approve a region's four-week plan, end to end including dispatcher review"
    baseline: "~2 days, planned by hand"
    figure: "~30 min"
    label: "to optimize and approve a region's four-week plan, down from ~2 days"
    figure_status: pov_result
    attribution:
      named_when_allowed: "Proof of value · <the delivery customer>"
      otherwise: "proof of value at a global home-appliance manufacturer"
    caveat: "KPIs measured before/after on proof-of-value data; figures are illustrative, not contractual."
    note: "Headline discipline (call-2026-07-09): the end-to-end figure, not the ~15-minute solve time."
    source: one-pager-2026-07-17, call-2026-07-09
  - name: Technician productivity
    kind: business
    owner_role: VP Field Service
    formula: "For each technician, total jobs ÷ days with at least one job; headline is the simple average across technicians, two decimals"
    baseline: "the customer's current plan for the same window, computed on the identical formula"
    figure: "up to +26%"
    label: "productivity gain on proof-of-value data across three markets"
    figure_status: pov_result
    attribution:
      named_when_allowed: "Proof of value · <the delivery customer>"
      otherwise: "proof of value at a global home-appliance manufacturer"
    caveat: "Productivity gain on proof-of-value data across the US, UK and Netherlands; illustrative, not contractual."
    note: "Pair any single-digit percentage with the sentence explaining why it is large at scale (call-2026-07-09)."
    source: one-pager-2026-07-17, spec-doc-2026-09-16
  - name: Estimated savings at full launch
    kind: business
    owner_role: COO
    formula: "Cost of the additional staffing avoided at the optimized productivity, extrapolated to full launch"
    baseline: "current staffing cost at the current plan"
    figure: "€190K / month"
    label: "estimated saving at full launch, valued as the staffing it avoids"
    figure_status: modeled
    attribution:
      named_when_allowed: "Proof of value · <the delivery customer>"
      otherwise: "proof of value at a global home-appliance manufacturer"
    caveat: "Estimated savings at full launch, valued as the cost of additional staffing avoided; illustrative, not contractual."
    note: >-
      The one-pager types this as an estimate at full launch, not a measured proof-of-value
      outcome, so `figure_status` is `modeled` rather than `pov_result`. Flagged for the owner.
    source: one-pager-2026-07-17
  - name: Capacity utilization
    kind: business
    owner_role: VP Field Service
    formula: "round(jobs ÷ (working days × 7) × 100), capped 0–100; the model assumes at most 7 jobs per technician per working day"
    baseline: "the current plan for the same window"
    figure: "-"
    figure_status: "-"
    caveat: "Computed identically on the current and the optimized plan; measured per engagement."
    note: "Defined and measured, no cleared headline figure. The schema's figure_status enum has no value for this state."
    source: spec-doc-2026-09-16, feature-list-2026-09-10
  - name: Customer wait time
    kind: business
    owner_role: VP Customer Service
    formula: "Booking date to appointment date in whole calendar days, averaged across jobs"
    baseline: "the current plan for the same window"
    figure: "-"
    figure_status: "-"
    caveat: "Computed identically on the current and the optimized plan; measured per engagement."
    source: spec-doc-2026-09-16
  - name: Travel reduction
    kind: business
    owner_role: VP Field Service
    formula: "Total planned travel across the period, current plan against optimized plan"
    baseline: "the current plan for the same window"
    figure: "-"
    figure_status: "-"
    caveat: "Computed identically on the current and the optimized plan; measured per engagement."
    source: feature-list-2026-09-10
  - name: Workload balance
    kind: business
    owner_role: VP Field Service
    formula: "Spread of jobs per technician across the period, current plan against optimized plan"
    baseline: "the current plan for the same window"
    figure: "-"
    figure_status: "-"
    caveat: "Computed identically on the current and the optimized plan; measured per engagement."
    source: feature-list-2026-09-10

packages:                                # component 12
  tiers:
    - id: pov
      name: PoV Jumpstart
      size_tag: S
      scope_line: "Manual data import, limited rule set: prove the KPI gains on the customer's data."
      duration_weeks: { target: 8, min: 6, max: 8, hard_cap: 10 }
      duration_note: >-
        The delivered print artifacts say "2 months" and the mini-site says "4–8 weeks";
        normalized to 8 weeks per decisions-2026-09-18. The skill pushes back above 8 with
        reasons and rejects above 10. The standing rule (shared/references/pov-rules.md) allows
        a 4-week floor; this pack's own floor is 6 because the PoV needs a full four-week
        planning period of the customer's data plus a dispatcher review cycle on top.
      services_price: { value: 90000, currency: EUR, status: confirmed, footnote: "One-time. €100K on an early deck slide was a slip; €90K is the confirmed figure." }
      infra_price_monthly: { value: 2000, currency: EUR, status: indicative, footnote: "Indicative; depends on the usage and optimization rules complexity." }
      what_you_get:
        - "An optimized four-week plan for one real region, computed on the customer's own historical data"
        - "A before/after KPI readout — productivity, capacity utilization and wait time — computed identically on the current and the optimized plan"
        - "The dispatcher review UI running in a sandboxed environment on the customer's own tenancy"
        - "A costed plan for the next step: integration scope, additional sources, timeline"
      entry_gate:
        - "One real region and a period of historical planning data — demand, availability, skills, work zones and bookings"
        - "The allocation rules that actually apply: zones, skills, absences, service commitments"
        - "A dispatcher and a business owner who will review the plan and sign the baseline"
      scope_in:
        - "Foundational allocation with the recurring, most-typical constraints — zones, skills, planned absences"
        - "Core KPIs predicted at scheduling and measured against the signed benchmark"
        - "The dispatcher review UI, with approve, reject and re-run"
        - "Sandboxed deployment on the customer's own tenancy"
        - "A before/after KPI readout computed identically on both plans"
      scope_out:
        - "Oracle Fusion Field Service integration — Integration tier; the PoV is file export / import"
        - "Additional data sources and BI integration — Integration tier"
        - "The re-optimization feedback loop — Integration tier"
        - "Live-traffic travel rules, within-day reassignment, spare-parts and crew-based assignment — roadmap"
      source: one-pager-2026-07-17, site-2026-09-17, decisions-2026-09-18
    - id: integration
      name: Integration
      size_tag: M
      scope_line: "Full setup and integration, live at one location: no manual work, embedded in the workflow."
      duration_weeks: { min: 12, max: 20 }
      services_price: { range: [300000, 500000], currency: EUR, status: indicative }
      infra_price_monthly: { value: 25000, currency: EUR, status: indicative, footnote: "Indicative; depends on the usage and optimization rules complexity." }
      what_you_get:
        - "Oracle Fusion Field Service integration: staff, availability and booking data in; optimized allocations out; factual durations and times back"
        - "Up to five further integrations — booking, inventory for parts availability, HR/WFM for people availability, demand forecasting, BI"
        - "The re-optimization feedback loop with alternative allocation options"
        - "Advanced allocation with the full operational complexity — urgent jobs, crews, SLAs, inventory-coupling"
        - "Enterprise-integrated deployment: dedicated landing zone, IAM, observability"
      name_note: 'Printed as "Roll-out · M" on the delivered artifacts; relabelled to "Integration" at next rebuild.'
      source: one-pager-2026-07-17, deck-2026-07-13, decisions-2026-09-18
    - id: scaling
      name: Scaling
      size_tag: L
      scope_line: "Scaling across locations: heterogeneous rules and data workflows per region."
      duration_weeks: { min: 12, max: 52 }
      services_price: { status: tbd }
      infra_price_monthly: { status: tbd }
      what_you_get:
        - "Multiple region-specific optimization-rule configurations"
        - "Region-specific KPI sets and analytics"
        - "Multi-region integration and enterprise-integrated, multi-zone deployment"
      name_note: >-
        Frame as telemetry and local tailoring. Never label this tier "hardening" — it invites
        "what was wrong before?" (call-2026-06-26).
      source: one-pager-2026-07-17, deck-2026-07-13, call-2026-06-26
  tier_semantics: >-
    Tiers map to integration depth, not feature count (call-2026-06-26). PoV Jumpstart proves the
    value on the customer's data with zero integration in a separate environment; Integration
    delivers a live, fully-integrated deployment at one location; Scaling extends it across markets
    with per-region rules and telemetry. PoV Jumpstart and Scaling are both optional — a bought-in
    customer goes straight to Integration, and a uniform global customer may never need Scaling.
  capability_handling_legend: "◐ partial · ● included · ●● multi-region / advanced · — not included"
  capability_handling:
    # The six commercial rows of the packages table. They are a different cut from the feature
    # list's four areas; `maps_to_feature_areas` is the bridge the builders use.
    - area: Optimization rules & guardrails
      maps_to_feature_areas: [Allocation rules]
      pov: "◐ Foundational allocation with recurring, most-typical constraints — zones, skills, planned absences"
      integration: "● Advanced allocation with all operational complexities — urgent jobs, crews, SLAs, inventory-coupling"
      scaling: "●● Multiple region-specific optimization-rule configurations"
    - area: Re-optimization & feedback loop
      maps_to_feature_areas: [Review and approval workflow]
      pov: "— Not included"
      integration: "● Feedback-driven re-optimization with alternative allocation options"
      scaling: "●● Region-specific workflows"
    - area: Analytics & efficiency KPIs
      maps_to_feature_areas: [KPIs and analytics]
      pov: "● Core KPIs predicted at scheduling"
      integration: "● Plus execution-data feedback and custom analytics"
      scaling: "●● Region-specific KPI sets"
    - area: Oracle Fusion Field Service integration
      maps_to_feature_areas: [Integrations]
      pov: "— Not included; file export / import"
      integration: "● In: staff, availability, booking data · Out: allocations · Back: factual durations and times"
      scaling: "●● Multi-region"
    - area: Additional data sources & BI
      maps_to_feature_areas: [Integrations]
      pov: "— Not included"
      integration: "● Up to 5 typical integrations — booking system, inventory for parts availability, HR/WFM for people availability, demand forecasting, BI"
      scaling: "●● Per-region data workflows"
    - area: Deployment
      maps_to_feature_areas: []
      pov: "◐ Sandboxed"
      integration: "● Enterprise-integrated — dedicated landing zone, IAM, observability"
      scaling: "●● Enterprise-integrated, multi-zone"
  why_it_sells_for_the_partner:
    - "A natural Oracle Fusion Field Service cross-sell: native integration, known endpoints, a warm path into the account"
    - "Net-new OCI consumption: recurring GPU workloads on dedicated OCI clusters, on top of the existing Fusion SaaS seat"
    - "Repeatable: fits any Oracle Fusion Field Service customer with a heavy, centralized dispatch and scheduling routine"
  target_oci_consumption: "-"            # open: committed on call-2026-07-09, never added to an artifact
  source: one-pager-2026-07-17, decisions-2026-09-18

