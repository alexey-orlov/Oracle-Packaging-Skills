packages:                                  # component 12
  anchor_line: "Runs on OCI — every run is GPU consumption an Oracle account exec can sell; Oracle CX is the natural system of record."
  tier_vocabulary_note: "PoV Jumpstart / Integration / Scaling per decisions-2026-09-18. S/M/L survive only as internal size tags."
  tiers:
    - id: pov
      name: PoV Jumpstart
      size_tag: S
      scope_line: "One signal set, one segment, files in and out: prove the reviewer agrees."
      duration_weeks: { target: 8, min: 6, max: 8, hard_cap: 10 }
      duration_note: >-
        Signed off at 6-8 weeks (user:2026-09-22), deliberately narrower than the source
        engagement's contracted 12 weeks, which exceeds the 10-week cap. The 12-week engagement
        is the full-scope shape and sits a tier above.
      services_price: { status: tbd, footnote: "Services price to be defined; set per engagement." }   # the reason it is unset is internal (open question: pricing) and never printed
      infra_price_monthly: { status: tbd, footnote: "Depends on signal volume, account count and source licensing." }
      what_you_get:
        - "Reviewed opportunity records across one real account segment, on the organization's own companies and catalog of moves"
        - "A reviewer agreement and confidence-calibration readout from the client's own reviewers"
        - "The reviewer UI running in a sandboxed environment on the client's own tenancy"
        - "A costed plan for the next step: integration scope, source licensing, routing"
      entry_gate:
        - "A named in-scope set of companies with framing in the system of record that can be extracted"
        - "The organization's own catalog of moves — service lines, partnership offers or value levers — or the material it can be captured from"
        - "A licence-cleared signal source set — rights to put the source into a model and redistribute the output"
        - "Reviewers who will actually review, and whose approve / reject is the acceptance measure"
      scope_in:
        - "Signal ingestion and grounding against the organization's own system-of-record extract and catalog of moves"
        - "Signal normalization — relevance, de-duplication and account resolution"
        - "Opportunity and risk reasoning mapped to a named next move"
        - "Descriptive cross-account ripple, up to two levels"
        - "Magnitude and confidence scoring with citations"
        - "Reviewer UI and the evaluation harness"
      scope_out:
        - "Acting on opportunities — auto-outreach, task creation, workflow automation"
        - "Validating candidates against the client's existing pipeline"
        - "Monetary sizing and interactive question-and-answer over the output"
        - "Live write-back to the system of record and a persistent historical signal store"
        - "Deep financial or quantitative modeling"
        - "Native multilingual processing"
        - "Routing to the account owner, and outcome capture — Integration and Scaling tiers"
    - id: integration
      name: Integration
      size_tag: M
      scope_line: "Wired into the team's day: licensed feeds in, system of record out."
      duration_weeks: { status: tbd }
      services_price: { status: tbd }
      infra_price_monthly: { status: tbd }   # the row prints for every tier, as its PoV peer does
      scope_in:
        - "The client's own licensed commercial feeds, replacing the PoV's bounded source set"
        - "Export to the team's system of record"
        - "Routing to the named owner of each account"
        - "Recurrence as a standing subscription per account, with delta reasoning and a nothing-material state"
        - "Dual implication — one signal producing an opportunity and a risk to different owners"
    - id: scaling
      name: Scaling
      size_tag: L
      scope_line: "Make it improve: live write-back, outcome capture, confidence tested against real outcomes."
      duration_weeks: { status: tbd }
      services_price: { status: tbd }
      infra_price_monthly: { status: tbd }   # the row prints for every tier, as its PoV peer does
      scope_in:
        - "Live write-back with idempotency and dedupe-on-write"
        - "Outcome capture feeding realized results back into scoring"
        - "Graph-backed ripple over a licensed relationship graph"
        - "Feedback-driven tuning as a persisted learning loop"

  capability_handling_legend: "◐ partial · ● included · ●● advanced / multi-source · — not included"
  capability_handling:
    - area: Grounding & sources
      maps_to_feature_areas: [Account universe & grounding]
      pov: "◐ One set of companies; an agreed extract; a bounded, licensed source set"
      integration: "● Their own licensed feeds; a versioned catalog of moves"
      scaling: "●● Multi-source, multi-market; a licensed relationship graph"
    - area: Signal normalization
      maps_to_feature_areas: [Signal intake & normalization]
      pov: "◐ Relevance, de-duplication, account resolution; scheduled and on-demand runs"
      integration: "● A standing watch per account, reporting what changed since last time — or that nothing did"
      scaling: "●● Deadline-driven triggers; sources gated by reliability class"
    - area: Implication reasoning
      maps_to_feature_areas: [Implication reasoning]
      pov: "● Opportunity and risk reasoning; next-move mapping; ripple to two levels; scoring"
      integration: "● Opportunity and risk routed to separate owners; map to offerings, levers or mitigations"
      scaling: "●● Graph-backed ripple, portfolio aggregation, cost-aware ranking"
    - area: Review & evidence
      maps_to_feature_areas: [Review & evidence]
      pov: "● Reviewer UI; citations; evaluation harness; feedback capture"
      integration: "● Human triage of raw inbound; a 'nothing found' verdict recorded like any other"
      scaling: "●● Tuning from reviewer feedback, kept as a learning loop; replay of any past day"
    - area: Output & delivery
      maps_to_feature_areas: [Output & delivery]
      pov: "◐ Records exported as files; reviewer decisions captured, not written back"
      integration: "● Export to the system of record; routing to the owner"
      scaling: "●● Live write-back; outcome capture feeding scoring"
  value_for_partner: >-
    Attaches recurring OCI GPU consumption — a dedicated AI cluster running NVIDIA AI-Q — to the
    account, driven by signal volume rather than seats; the reviewed records land in Oracle CX as the
    system of record, net-new on top of the SaaS seat.
  value_for_client: >-
    Account managers move from researching their accounts to reviewing a scored, cited list of opportunities and
    risks per account; the hours they spend preparing, how fast they act on a change and the pipeline they add are
    measured in the proof of value, and the reviewers' own approve / reject decisions are its acceptance test.
  why_it_sells_for_the_partner:
    - "Net-new OCI consumption: recurring GPU and inference workloads on dedicated OCI clusters, driven by signal volume rather than seat count"
    - "Complements Oracle's own account intelligence: Sales Command Center works on first-party CX data; Account insights brings the external signal and the next move"
    - "Repeatable across Oracle customers with named accounts: customer accounts in Oracle CX, partners or portfolio holdings, with a real catalog of moves"
  target_oci_consumption: "-"
  source: research-brief-2026-09-22, decisions-2026-09-18

