      {Customer}'s account teams prepare the briefings on their enterprise customers by hand — company context, strategic and operational signals, and what each one means for {customer}'s logistics services — and see only the company in the headline.
    delivered: >-
      Client Compass reads the news, filings and {customer}'s own account records for every account in scope and hands each account manager a reviewed list: what changed, what it means for {customer}'s logistics services, and the next move — scored and cited to source, approved or rejected in a reviewer screen before it goes anywhere.
