clearance:
  customer_name_allowed:
    internal: false
    partner_print: false
    customer_site: false
    demo: false
  anonymized_descriptor: a multi-market vehicle services network
  descriptor_warning: >
    Any descriptor naming vehicle glass plus multi-market back-solves to one company. External
    artifacts should rest on the domain and standards evidence and make no source-engagement
    reference at all.
  internal_only_facts:
    - contract value and the add-on phase value
    - the named account and its pathfinder market
    - the two-vendor tender situation
    - team member names
    - the partner-signature status
  approvals: []

problem_solution:
  problem: >
    Companies that fix damaged vehicles, containers and equipment decide from photos whether to
    repair or replace. Guessing costs money in both directions.
  sub_problems:
    - label: Needless replacements
      text: a part gets swapped when a repair would have held.
    - label: Repeat visits
      text: a repair that should have been a replacement fails and comes back.
    - label: No consistent answer
      text: >
        the limits that settle it differ between markets and contracts and are rarely written down,
        so two sites decide the same damage differently.
  solution: >
    The inspector sees the measured size, the rule that applies, and the recommended call — then
    confirms it or overrules it. Every decision keeps its reason, so a disputed one is answered from
    the record instead of from memory.
  reframe: "Check the call, don't make it"
  outcomes: ["Needless replacements ↓", "Repeat visits ↓", "Same answer at every site"]
  source: user:2026-09-22

one_liner:
  full: >
    Photos of a damaged item become a measured repair-or-replace decision, checked against the rules
    that apply and recorded with its reason — so you replace only what has to be replaced.
  short: "Replace only what has to be replaced — measured from photos, not estimated by eye."
  banned_words_checked: true
  source: user:2026-09-22

icp:
  line: >
    Two buyers, deliberately. The operator that carries the cost of a wrong repair-or-replace call —
    a service network, depot, branch or maintenance organisation — and the payer that funds the
    remediation and wants fewer replacements: an insurer, a lessor or a fleet owner. Both decide from
    media before anyone sees the asset in person, and both are accountable for the same decision.
  dual_buyer_rule: >
    CONFIRMED DECISION (user:2026-09-22): the pack addresses BOTH buyers, and every artifact must carry
    both. Concretely — the deck and one-pager name both in the audience line and give each its own value
    row; the listing's problem-and-solution strip reads for both; each industry names which buyer leads
    there; the metrics say whose number each one is; and the packages say what each buyer gets. No
    artifact may silently address only one.
  buyer_roles: [Director of Operations, Network Operations Director, Head of Technical Standards,
                Head of Claims, Claims Operations Director, Fleet or Lease Portfolio Manager]
  buyer_roles_operator: [Director of Operations, Network Operations Director, Head of Technical Standards]
  buyer_roles_payer: [Head of Claims, Claims Operations Director, Fleet or Lease Portfolio Manager]
  buyer_by_industry:
    Vehicle glazing: "operator leads; the payer applies the repair-first pressure"
    Shipping containers: "operator leads (the depot), with the lessor approving line by line"
    Rental and lease handover: "payer leads (the lessor), because the output is a charge"
    Vehicle body and paint at first notice of loss: "payer leads (the insurer)"
    Aircraft skin: "operator leads (the airline or maintenance organisation)"
  qualifying_signals:
    - operates across markets or contracts whose repair limits differ
    - already reports a repair-versus-replace rate, or is asked to by a payer
    - can count disputes, supplements or repeat visits
    - customer- or technician-captured media already arrives, or a capture channel exists
    - a booking, dispatch or claims system exists to write a resolved scope into
  disqualifiers:
    - single site with one rule set
    - the decision is made by a technician already physically at the asset
    - assets with no identifier that resolves to known geometry
    - the deciding variable is not visible in ordinary photography
  why_both: >
    The value of replacing less accrues to the payer, while the operator earns on replacements and
    carries no software budget line for this today. Addressing only the operator asks them to fund a
    saving someone else banks; addressing only the payer leaves the decision with the party that does
    not make it. The pack is sold to the pair.
  source: user:2026-09-22

verticals:
  - name: Vehicle glazing
    framing:
      problem: "Call agents book a repair or a replacement before anyone sees the vehicle."
      solution: "The agent confirms a measured call and books the right job, kit and slot."
    entities_differ: "one safety-critical panel whose function is the driver's sight-line"
    what_matters_here: "Two measured features, not one, in Germany; a replace triggers sensor recalibration"
    worked_example: "A chip in the driver's viewing area: repairable in the US under 25 mm, prohibited outright in Germany."
    status: plausible
  - name: Shipping containers
    framing:
      problem: "Depot surveyors propose repairs the owner approves line by line."
      solution: "The surveyor submits coded damage with only the permissible remedies attached."
    entities_differ: "a steel unit with published standard geometry and its identifier beside the defect"
    what_matters_here: "Damage-to-remedy pairs are codified; illegal pairs cannot be expressed"
    worked_example: "A hole in a panel cannot be straightened — only patched or replaced."
    status: plausible
  - name: Rental and lease handover
    framing:
      problem: "Branch staff decide what a returning customer is charged for damage."
      solution: "New damage is separated from pre-existing, with the evidence attached to the charge."
    entities_differ: "a whole unit compared against a prior condition record"
    what_matters_here: "The output is a bill, so the record faces a hostile lay audience"
    worked_example: "A scratch within the fair-wear allowance on return versus one added during the hire."
    status: plausible
  - name: Vehicle body and paint at first notice of loss
    framing:
      problem: "Claims handlers decide repair, replace or write-off from photos of the damage."
      solution: "The handler reviews a costed scope with the write-off threshold already applied."
    entities_differ: "a set of panels priced against a parts list and published labour times"
    what_matters_here: "The ceiling is economic and set per jurisdiction, not by a safety rule"
    worked_example: "Repair cost against a share of the vehicle's value, where the share is set locally."
    status: plausible
  - name: Aircraft skin
    framing:
      problem: "Engineers disposition surface damage against published structural limits."
      solution: "The engineer gets the limit, the measurement and the record in one place."
    entities_differ: "a structural panel with a permanent, mandatory damage history"
    what_matters_here: "A fourth outcome exists: accept the damage and record it"
    worked_example: "A dent inside allowable limits, logged to the aircraft's damage chart rather than repaired."
    status: plausible
verticals_held_out:
  note: >
    Passed on reasoning but not on evidence; the research ran out of search budget before they could
    be checked. They are deliberately NOT in the pack and must not appear in any artifact until
    verified. Lifting and rigging gear is the one to check first — it may outrank rental handover.
  candidates: [lifting and rigging gear, micromobility fleets, agricultural and construction machinery]
verticals_rejected:
  - name: Property and roof claims
    reason: "The decision is a sampled hit count over an area, plus reconstructing a structure with no parts list."
  - name: Industrial equipment condition
    reason: "Severity is a rate of change across inspections, with no external rule to cite and no scale anchor."
  - name: Phone and laptop grading
    reason: "No dimensional threshold exists on either side, and the volume version runs on a fixed rig."
  - name: Utility poles
    reason: "The deciding variable is internal decay, invisible in any photograph."

capabilities:
  - area: Capture & intake
    customization_scope_area: "The capture channel, its branding and its languages"
    categories:
      - name: Assignment & invitation
        features:
          - { name: "Assignment raised from a booking or claim reference", status: partial, tier_first_available: pov, customization_scope: "The reference shape per operator", source: "sow: the upload entry point" }
          - { name: "Capture invitation to the asset holder", status: roadmap, tier_first_available: integration, customization_scope: "The operator's own channels", source: "research: the customer's own solution requirements" }
      - name: Guided capture
        features:
          - { name: "In-capture guidance on framing, distance, glare and steadiness", status: roadmap, tier_first_available: pov, customization_scope: "Prompts per asset class", source: "research: what the vendors already ship" }
          - { name: "Scale anchoring so a dimension can be recovered", status: roadmap, tier_first_available: pov, customization_scope: "Which of the three anchors a customer can supply", source: "research: the technical screen" }
          - { name: "Two-sided capture where the standard requires both sides", status: roadmap, tier_first_available: pov, customization_scope: "Per governing standard", source: "research: the US repairability standard, clause 8.1" }
      - name: Media quality gate
        features:
          - { name: "Usability check with a reasoned retake request", status: roadmap, tier_first_available: pov, customization_scope: "Thresholds per asset class", source: "research: what the vendors already ship" }
  - area: Damage assessment
    customization_scope_area: "The damage taxonomy and the measured features, per asset class"
    categories:
      - name: Asset identification
        features:
          - { name: "Identifier read from the media itself", status: available, tier_first_available: pov, customization_scope: "Identifier formats per asset class", source: "sow: the identifier detection block" }
          - { name: "Asset record and geometry retrieval", status: partial, tier_first_available: integration, customization_scope: "The customer's record system", source: "research: the customer's stated primary source" }
      - name: Damage detection
        features:
          - { name: "Damage located and bounded in each frame", status: available, tier_first_available: pov, customization_scope: "None", source: "research: shipped by the vendor platform" }
          - { name: "The same damage tracked across frames", status: available, tier_first_available: pov, customization_scope: "None", source: "research: shipped by the vendor platform" }
          - { name: "Damage classified against a configurable taxonomy", status: partial, tier_first_available: pov, customization_scope: "The taxonomy per asset class", source: "sow: two classes scoped, six required by the customer" }
      - name: Measurement
        features:
          - { name: "Each instance measured, with the basis stated", status: roadmap, tier_first_available: pov, customization_scope: "The measured features per standard", source: "research: no vendor publishes a measurement claim" }
          - { name: "Two features measured independently where a standard requires it", status: roadmap, tier_first_available: pov, customization_scope: "Per market", source: "research: the German rule measures crater and cracks separately" }
          - { name: "Position assigned against the governing zone", status: roadmap, tier_first_available: pov, customization_scope: "Zone geometry per market", source: "research: four different zone constructions" }
          - { name: "Post-repair residual predicted where the rule judges the repaired state", status: roadmap, tier_first_available: integration, customization_scope: "Per market", source: "research: German and Austrian trade bodies judge the residual" }
      - name: Prior damage
        features:
          - { name: "New damage separated from pre-existing and previously repaired", status: roadmap, tier_first_available: integration, customization_scope: "The prior record source", source: "research: sold next door as incremental damage tracking" }
          - { name: "Proximity to an earlier repair checked where a standard forbids it", status: roadmap, tier_first_available: integration, customization_scope: "Per standard", source: "research: the 100 mm rule in the US standard" }
  - area: Decision & estimate
    customization_scope_area: "The rule set per market and contract \u2014 this is the priced scope"
    categories:
      - name: The decision
        features:
          - { name: "Repair, replace or refer with a confidence attached", status: available, tier_first_available: pov, customization_scope: "The outcome set per asset class", source: "sow: the recommendation output" }
          - { name: "The rule, the frame and the measured value cited on every decision", status: partial, tier_first_available: pov, customization_scope: "None", source: "sow: cited guidance scoped; the measured value is absent" }
          - { name: "A tunable threshold between the two kinds of error", status: partial, tier_first_available: pov, customization_scope: "Per operator's cost asymmetry", source: "response: a probability-weighted score rather than a binary call" }
          - { name: "The kind of deciding rule is configurable, not assumed", status: roadmap, tier_first_available: integration, customization_scope: "Per industry", source: "research: the rule changes kind across industries" }
      - name: Dependent work
        features:
          - { name: "Dependent work a replacement triggers is flagged at the decision", status: roadmap, tier_first_available: pov, customization_scope: "Per asset class", source: "research: no competitor flags it" }
          - { name: "Safety-critical or unusable flagged as a second output", status: roadmap, tier_first_available: integration, customization_scope: "Per asset class", source: "research: one competitor ships this shape" }
      - name: Priced scope
        features:
          - { name: "Scope priced from a parts and labour source", status: roadmap, tier_first_available: scaling, customization_scope: "The source per market \u2014 Europe has no single catalogue", source: "research: the catalogue owners" }
          - { name: "Write-off test against a configurable ceiling", status: roadmap, tier_first_available: scaling, customization_scope: "The ceiling per jurisdiction", source: "research: absent in glazing, core in three industries" }
  - area: Assurance & audit
    customization_scope_area: "Reviewer roles, thresholds and response times"
    categories:
      - name: Submission integrity
        features:
          - { name: "Media authenticity and tamper detection", status: roadmap, tier_first_available: pov, customization_scope: "Per channel", source: "research: a regulator names fabricated damage images as a fraud route" }
          - { name: "The same media detected across cases", status: roadmap, tier_first_available: integration, customization_scope: "The case corpus", source: "research: sold as its own product by three vendors" }
      - name: Review
        features:
          - { name: "Cases routed on confidence, policy and integrity", status: partial, tier_first_available: pov, customization_scope: "Routing policy per operator", source: "sow: routing asserted, thresholds unspecified" }
          - { name: "A reviewer workspace showing media, reading and cited rule together", status: partial, tier_first_available: pov, customization_scope: "Roles and layout", source: "sow: one verification stage named, no design" }
          - { name: "Override with a captured reason", status: partial, tier_first_available: pov, customization_scope: "Reason codes per operator", source: "research: no competitor persists the override" }
          - { name: "Override rate instrumented as an aggregate product metric", status: roadmap, tier_first_available: pov, customization_scope: "None \u2014 never per individual reviewer", source: "research: the oversight test four regulators converge on" }
      - name: The record
        features:
          - { name: "A decision record holding rule, frame, measurement and reviewer", status: partial, tier_first_available: pov, customization_scope: "Export format", source: "sow: evidence export" }
          - { name: "Retention and deletion per market rules", status: partial, tier_first_available: integration, customization_scope: "Per market", source: "rfi: retention stated without periods" }
      - name: Machine checks
        features:
          - { name: "The output checked automatically before a person sees it", status: roadmap, tier_first_available: integration, customization_scope: "Check set per asset class", source: "research: one vendor ships this as its own module" }
  - area: Operations & administration
    customization_scope_area: "Who owns the rules, and across how many markets"
    categories:
      - name: Rule authoring
        features:
          - { name: "Rules authored, versioned and deployed per market", status: roadmap, tier_first_available: integration, customization_scope: "Authored by us at proof of value, by the customer later", source: "research: one vendor sells this as its own product; no competitor in this job has it" }
          - { name: "A rule change replayed against historical cases before it goes live", status: roadmap, tier_first_available: scaling, customization_scope: "The case history", source: "research: the vendor gap list" }
      - name: Handoff
        features:
          - { name: "Decision handed to booking or dispatch with its scope resolved", status: partial, tier_first_available: pov, customization_scope: "The downstream system", source: "research: the highest-value step the first draft dropped" }
          - { name: "Write-back into the system of record", status: partial, tier_first_available: integration, customization_scope: "Per system", source: "sow: an API exposed for later integration" }
      - name: Running it
        features:
          - { name: "Accuracy evaluated against an agreed holdout set, with the basis published", status: partial, tier_first_available: pov, customization_scope: "The holdout set per customer", source: "response: holdout and shadow comparison committed" }
          - { name: "Corrections fed back as training signal", status: roadmap, tier_first_available: integration, customization_scope: "Retraining cadence", source: "research: the customer's own requirement" }
          - { name: "Multi-market and multi-language administration", status: roadmap, tier_first_available: scaling, customization_scope: "Per market", source: "research: the customer operates across about forty" }

workflow:
  inputs:
    - { system: the operator's existing capture channel, data: "customer or technician media" }
    - { system: the asset master record, data: "identifier, geometry, attributes, prior condition" }
  steps:
    - n: 1
      name: Capture
      actor: human
      human_in_the_loop: false
      description: "The capture request reaches whoever holds the asset; media comes back, is checked for usability and for tampering, and a retake is requested when it is not good enough."
      failure_path: "No scale anchor in the media: no measured decision is possible, so the case is routed to a person"
    - n: 2
      name: Read the damage
      actor: ai
      human_in_the_loop: false
      description: "The asset is identified from its own markings, each damage instance is located, separated from damage that was already there, classified, and measured against the limit that governs it."
      failure_path: "Unmeasurable or unclassifiable: routed to a person with the reason stated, never closed silently"
    - n: 3
      name: The call
      actor: ai
      human_in_the_loop: false
      description: "Repair, replace or refer, with the rule it came from, the measurement it used and a confidence attached \u2014 plus any dependent work a replacement triggers."
      failure_path: "No rule covers the case: routed to a person, never guessed"
    - n: 4
      name: Cost it
      actor: ai
      human_in_the_loop: false
      description: "Where the industry decides on money rather than on a safety limit, the scope is priced and tested against the local write-off ceiling. Absent in vehicle glazing, which has no economic test at all."
      failure_path: "Not covered today: no parts and labour source is wired in, so the step is skipped and stated as out of scope"
    - n: 5
      name: Review and override
      actor: human
      human_in_the_loop: true
      description: "The inspector sees the media, the measurement and the cited rule beside the recommended call, and confirms it or overrules it with a reason. The override is kept."
      failure_path: "No reviewer available: queued against an agreed response time, and the queue is visible"
    - n: 6
      name: Authorised handoff
      actor: system
      human_in_the_loop: false
      description: "The confirmed decision is authorised and handed to the booking, dispatch or claims system with its scope resolved \u2014 part, skill, slot, dependent work \u2014 and the record is retained."
      failure_path: "Downstream unavailable: the decision is held and re-sent, never dropped"
  domain_steps_note: >
    The twelve-step domain workflow the industries actually share is in the research summary, section
    "The steps every industry shares". These six are the buyer's checkpoints over it.
  outputs:
    - { system: the booking, dispatch or claims system, data: "the confirmed decision and its resolved scope" }
  not_ours:
    - step: Checking whether the customer is covered
      reason: "Universal in the domain, but owning it makes this a claims product. Assumed resolved upstream."
  integration_tiers:
    pov: "file export and import, plus an exposed API"
    integration: "API write-back into the system of record"
    scaling: "API, telemetry and multi-market administration"

architecture:
  inputs:
    - { system: the operator's capture channel, data: "customer or technician media" }
    - { system: the asset master record, data: "identifier, geometry, prior condition" }
  stack:
    - layer: Custom configuration
      vendor: SoftServe
      items: ["the rule set per market and contract", "the damage taxonomy per asset class", "reviewer roles and thresholds"]
    - layer: Accelerator business app
      vendor: Oracle + SoftServe
      items: ["guided capture", "reviewer workspace", "rule authoring", "decision record"]
    - layer: Vision and reasoning engine
      vendor: NVIDIA
      items: ["video and image understanding", "retrieval over the rule set", "structured verdict output"]
      catalog_id: [nvidia-vss, nvidia-aiq, nvidia-ai-enterprise, nvidia-nim]
    - layer: Data platform
      vendor: Oracle
      items: ["media store", "decision and audit store", "rule-set versions"]
      catalog_id: [oci-object-storage, oracle-autonomous-ai-database]
    - layer: Infrastructure
      vendor: Oracle
      items: ["GPU compute", "Kubernetes", "API gateway", "identity", "observability"]
      catalog_id: [oci-gpu-instances, oci-kubernetes-engine, oci-api-gateway, oci-iam, oci-observability-management]
  outputs:
    - { system: the booking, dispatch or claims system, data: "the confirmed decision and its resolved scope" }
  platform_overlap_note: >
    Oracle already ships video search and summarization as a one-click accelerator pack with a
    front-end, infrastructure-as-code and an evaluation harness. Standing up that platform is not
    the pack. What it leaves open is measurement from a single uncalibrated camera, the rule layer
    and its versioning, a record that cites rule, frame and measured value, a persisted override,
    and the dispatchable consequence.

oracle_products:
  - id: oci
    role: required
    why: "The tenancy the pack runs in — GPU compute, Kubernetes, object storage, database, API gateway, identity and observability."
  - id: oracle-autonomous-ai-database
    role: required
    why: "Holds the decision record, the audit trail and the versioned rule sets."
  - id: oracle-integration
    role: optional
    why: "Binds the resolved decision into the operator's booking, dispatch or claims system."
    integration: { pov: "file export / import", integration: "API write-back", scaling: "API plus telemetry" }
  - id: oci-vision
    role: optional
    why: "An Oracle-native route for image detection and classification where the customer prefers it to the NVIDIA stack."
  - id: oracle-analytics-cloud
    role: optional
    why: "Reporting on decision mix, override rate and repeat visits."
  - id: oci-ai-accelerator-packs
    role: optional
    why: "The one-click video platform the pack builds on top of, rather than reimplements."

kpis_note: >
  CONFIRMED DECISION (user:2026-09-22): carry the modelled business case, clearly labelled modelled.
  Implemented as RATES AND UNIT COSTS, not as an absolute annual total — the total is computed from the
  source account's own volumes and would identify it even with the name removed, which the clearance
  instruction forbids. Expressing the model per unit also removes both defects in the original: the
  base-volume footnote error cannot arise without an absolute base, and the improvement assumption is
  stated once, as a 20% relative reduction, rather than contradicting a separate percentage-point claim
  elsewhere in the same document. Every figure below is MODELLED on industry assumptions, not measured:
  no result exists, because the engagement had not started. A seller applies these to the prospect's own
  volumes. When the proof of value produces measured figures, they replace these and the status changes.
kpis:
  - name: Needless replacement rate
    formula: "Replacements where a repair would have met the governing limit, over all remediation decisions"
    baseline: "3.0% modelled"
    figure: "2.4% — a 20% relative reduction"
    figure_status: modeled
    unit_cost: "about £50 per needless replacement"
    whose_metric: "the payer funds it; the operator is measured on it"
    attribution: { named_when_allowed: "-", otherwise: "modelled on industry volumes and unit costs, not a customer result" }
    caveat: "Modelled, not measured. Every driver is an assumption; apply to the prospect's own volumes."
    source: "research: the value model in the response set, re-expressed per unit"
  - name: Failed-repair and repeat-visit rate
    formula: "Repairs returning for the same damage within an agreed window, over all repairs"
    baseline: "1.5% modelled"
    figure: "1.2% — a 20% relative reduction"
    figure_status: modeled
    unit_cost: "about £75 per failed repair"
    whose_metric: "the operator absorbs the return visit"
    attribution: { named_when_allowed: "-", otherwise: "modelled on industry volumes and unit costs, not a customer result" }
    caveat: "Modelled, not measured. Apply to the prospect's own volumes."
    source: "research: the value model in the response set, re-expressed per unit"
  - name: Avoidable dependent work
    formula: "Dependent work triggered only because a replacement was chosen unnecessarily"
    baseline: "arises on the needless-replacement share; about 42% of vehicles in the modelled population"
    figure: "falls with the needless-replacement rate"
    figure_status: modeled
    unit_cost: "about £50 per avoided recalibration slot; industry data puts an unplanned one at $300–400 and about four days"
    whose_metric: "both — the operator loses the slot, the payer pays the line"
    attribution: { named_when_allowed: "-", otherwise: "modelled on industry volumes and unit costs, not a customer result" }
    caveat: "Modelled. The unplanned-recalibration cost and incidence are industry figures, separately sourced."
    source: "research: the value model plus published recalibration incidence"
  - name: Decision consistency across sites
    formula: "Share of matched damage cases receiving the same decision across sites in one market"
    baseline: "not measured anywhere today"
    figure: "-"
    whose_metric: "the payer audits it; the operator owns it"
    source: "research: no competitor reports this metric at all"
  - name: Reviewer override rate
    formula: "Decisions changed by the reviewer, over all decisions presented"
    baseline: "measured per engagement"
    figure: "-"
    whose_metric: "both — it is the evidence the human review is real"
    caveat: "An aggregate product metric only. Never used to evaluate individual reviewers."
    source: "research: the oversight test four regulators converge on"

packages:
  status: "(awaiting your confirmation — see open question 8)"
  tiers:
    - id: pov
      name: PoV Jumpstart
      size_tag: S
