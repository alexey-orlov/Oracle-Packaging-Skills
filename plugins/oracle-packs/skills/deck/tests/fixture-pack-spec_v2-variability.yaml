# Variability test spec for build_deck_v2.py — NOT a real pack.
# Deliberately different shape from the fixture: 3 verticals (one empty card),
# 7 capability rows, 2 architecture inputs and 2 outputs, a 3-product engine
# layer and a 3-layer stack (one fewer than the fixture).

meta:
  slug: contract-intelligence
  name: Contract Intelligence
  name_variants:
    site: Contract Intelligence
    internal_slide: Contract Intelligence App
    external: Contract Intelligence
    external_subheading: Accelerator App by SoftServe
  source_engagement:
    customer: (internal only)
    delivered: >-
      Proof of value on a live contract estate: clause extraction and obligation
      tracking reviewed by the customer's own legal operations team.
    divergence_from_pack: >-
      The pack generalizes the clause taxonomy; the delivered proof of value
      covered two contract families in one jurisdiction.
  status: confirmed
  spec_version: 1

clearance:
  customer_name_allowed:
    internal: false
    partner_print: false
  anonymized_descriptor: a European industrial group

problem_solution:
  problem: >-
    Legal operations read every contract by hand: obligations, renewal dates and
    liability caps live in PDFs nobody can query.
  problem_points:
    - "Slow answers: a single obligation question takes days of reading"
    - "Missed renewals: auto-renewals pass unnoticed and lock in old terms"
    - "Uneven review: two reviewers reach two different risk readings"
  solution: >-
    A retrieval and extraction service reads the whole estate, pulls clauses and
    obligations into a queryable model and flags the deviations. Reviewers work a
    ranked queue instead of a folder, approving or correcting each extraction.
  reframe: Review the exceptions, don't read the estate
  reframe_question: What if legal reviewed only the exceptions?
  today: >-
    Reviewers open contracts one by one, copy key dates into a spreadsheet and
    re-read the same clauses every time a question comes up.
  tomorrow: >-
    The estate is extracted once and kept current; reviewers see a ranked queue of
    deviations and confirm or correct each one.

one_liner:
  full: >-
    Extracts clauses, obligations and dates from a whole contract estate and puts
    the deviations in front of a reviewer.
  short: A contract estate, extracted once and reviewed by exception.

icp:
  line: Thousands of live contracts and a central legal operations team.
  buyer_roles: [General Counsel, Head of Legal Operations, CFO]

verticals:
  - name: Manufacturing & industrial supply
    what_matters_here: >-
      Track supplier obligations, price-adjustment clauses and termination rights
      across a long tail of framework agreements.
  - name: Financial services
    what_matters_here: >-
      Keep master agreements, annexes and regulatory covenants current, with an
      audit trail for every extracted term.
  - name: Energy & utilities
    what_matters_here: >-
      Follow long-dated offtake and maintenance contracts, their indexation terms
      and their renewal windows.

capabilities:
  - area: Extraction
    categories:
      - name: Clause extraction
        features:
          - name: Clause and obligation extraction with citations
            status: available
            tier_first_available: pov
    customization_scope_area: Custom clause taxonomy and extraction rules.

workflow:
  inputs:
    - system: Contract repository
      data: contract PDFs and metadata
  steps:
    - n: 1
      name: Ingest the estate
      actor: ai
      human_in_the_loop: false
    - n: 2
      name: Extract and cite
      actor: ai
      human_in_the_loop: false
    - n: 3
      name: Review the exceptions
      actor: human
      human_in_the_loop: true
  outputs:
    - system: Contract repository
      data: confirmed terms written back

architecture:
  inputs:
    - system: Contract repository
      data: contract PDFs, parties, effective dates
    - system: ERP
      data: supplier master and spend
  stack:
    - layer: Review workspace
      vendor: Oracle + SoftServe
      summary: The reviewer queue, the citation viewer and the audit trail
      items: [reviewer queue, citation viewer, audit trail]
    - layer: Extraction engine
      vendor: NVIDIA
      summary: Retrieval, extraction and ranking over the whole estate
      items: [nvidia-nemo]
      catalog_id: [nvidia-nemo-agent-toolkit, nvidia-nim]   # a list: the box must name every product
    - layer: Infrastructure
      vendor: Oracle
      summary: OCI compute with GPUs, object storage and IAM
      items: [GPU cluster, object storage, IAM]
  outputs:
    - system: Contract repository
      data: confirmed clauses and obligations
    - system: Obligation dashboard
      data: renewal and deviation reporting

