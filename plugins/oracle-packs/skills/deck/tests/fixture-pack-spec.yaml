problem_solution:
  problem: >-
    Field-service operators plan their mobile workforce by hand: work zones,
    technician assignments, dozens of rules and constraints.
  problem_points:
    - "Suboptimal efficiency: uneven workloads and under-used capacity"
    - "Lower customer satisfaction: longer wait times from suboptimal allocations"
    - "Poor scalability: planning hinges on scarce senior dispatchers; new zones launch slowly"
  solution: >-
    A GPU optimization engine ingests demand, availability, skills and
    constraints and computes the best technician-to-zone-to-job plan in
    minutes. Dispatchers review it on a live map, re-optimize and write the
    approved plan back to the field-service system.
  reframe: Review the plan, don't build it
  reframe_question: What if dispatchers reviewed the plan instead of building it?
  today: >-
    Dispatchers maintain work zones and technician allocations by hand — region
    by region, juggling postcode coverage, skills, working days and absences,
    with little room left to optimize.
  tomorrow: >-
    The dispatcher uploads the period's data, runs the optimizer, and reviews
    the proposed allocation on a live map — comparing, approving or re-running
    before the plan is exported.
  source: user:2026-09-18

one_liner:
