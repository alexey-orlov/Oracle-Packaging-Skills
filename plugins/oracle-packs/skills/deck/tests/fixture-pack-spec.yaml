workflow:
  inputs:
    - system: Field-service system of record
      data: work orders, technicians, zones, availability
  steps:
    - n: 1
      name: Load the period's data
      actor: human
      human_in_the_loop: true
      failure_path: Missing fields flag the row, never drop it; the dispatcher resolves.
    - n: 2
      name: Set the rules
      actor: human
      human_in_the_loop: true
      failure_path: A conflicting hard rule blocks the run with the conflicting pair named.
    - n: 3
      name: Solve the plan
      actor: ai
      human_in_the_loop: false
      failure_path: No feasible plan → the binding constraint is reported, not a partial plan.
    - n: 4
      name: Review, approve, measure
      actor: human
      human_in_the_loop: true
      failure_path: Rejected zones return to step 2 with the dispatcher's comment attached.
  outputs:
    - system: Field-service system of record
      data: approved plan written back

architecture:
  inputs:
    - system: Field-service system of record
      data: technicians, availability, bookings, default allocations
    - system: Additional data sources
      data: booking system, parts inventory, HR/WFM, demand forecasting
  stack:
    - layer: Custom configuration
      vendor: SoftServe
      summary: Client rules, constraints and KPI definitions
      items: [rule set, objective weights, KPI definitions]
    - layer: Accelerator business app
      vendor: Oracle + SoftServe
      summary: The optimization app and its dispatcher console
      items: [optimizer service, dispatcher UI, plan versioning]
    - layer: Optimization engine
      vendor: NVIDIA
      summary: GPU-accelerated solver for large-scale workforce and route optimization
      items: [NVIDIA cuOpt]
      catalog_id: nvidia-cuopt          # NVIDIA, so it lives here and not in oracle_products
    - layer: Infrastructure
      vendor: Oracle
      summary: OCI compute with GPUs, object storage, networking and IAM
      items: [dedicated GPU cluster (4–8 GPUs), object storage, networking, IAM]
  outputs:
    - system: Field-service system of record
      data: optimized allocations — zones and visits
    - system: BI
      data: KPIs per plan version

