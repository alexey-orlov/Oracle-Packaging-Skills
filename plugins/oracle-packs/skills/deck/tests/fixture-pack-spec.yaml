  source: user:2026-09-18

verticals:
  - name: Residential appliance & white-goods repair
    framing:
      problem: In-home repair is planned by hand against parts, skills and travel.
      solution: The solver plans the whole region against skills, parts, travel and existing bookings at once.
    what_matters_here: >-
      Dispatch home-repair technicians by skill, spare parts and travel —
      absorbing urgent call-outs and no-shows without re-planning the day.
    status: proven
  - name: Utilities — water · gas · electric
    framing:
      problem: Crews are scheduled across territories against SLAs and outage spikes.
      solution: Planned and emergency work are balanced in one optimization pass.
    what_matters_here: >-
      Schedule field crews across service territories against SLAs, outage
      spikes and crew certifications, balancing planned and emergency work.
    status: plausible
  - name: Telecom & cable
    framing:
      problem: Install-and-repair visits must hit tight appointment windows.
      solution: Line skills and travel are matched to the window before the day starts.
    what_matters_here: >-
      Route install-and-repair technicians to tight appointment windows across
      regions, matching line skills and cutting customer wait time.
    status: plausible
  - name: Industrial · medical-device · IT equipment service
    framing:
      problem: Contracted equipment needs engineers matched by skill and SLA.
      solution: Asset-based allocation keeps uptime-critical machines covered.
    what_matters_here: >-
      Allocate asset-based service engineers to contracted equipment by skill,
      SLA and location — keeping high-value machines uptime-critical.
    status: plausible

