# What /oracle-packs:spec loads, step by step.
#
# The rule the skill obeys: load only the file(s) listed for the step you are
# on, never the whole folder. `session` files enter the conversation and are
# charged to that step's budget; `agents` files are read by a subagent in its
# own fresh context and are reported, not charged.
#
# Checked by: shared/tools/context_budget.py (see docs/CONTEXT-BUDGET.md).

budget:
  tokens_per_word: 1.35
  start_up_tokens: 6000
  step_tokens: 2000

root: ../..                  # the spec skill folder; `shared/...` resolves to the bundle's shared folder

steps:
  - id: start-up
    title: Before the first message
    start_up: true
    session:
      - SKILL.md
      - references/cards/owner-language.md
      - references/cards/manifest.yaml

  - id: stage-1-before-we-start
    title: Stage 1 — Before we start
    session:
      - references/cards/intake-a.md
      - references/cards/intake-b.md
      - references/cards/intake-c.md

  - id: stage-2-research
    title: Stage 2 — Research (running the fan-out)
    session:
      - references/cards/research.md
    agents:
      - references/generalization-method.md
      - shared/references/research-standards.md

  - id: stage-2-summary
    title: Stage 2 — Research (writing the summary)
    session:
      - references/research-brief-format.md

  - id: stage-3-your-call
    title: Stage 3 — Your call on the research
    session:
      - references/cards/research-review.md

  - id: stage-4-story
    title: Stage 4 — The pack's story
    session:
      - references/cards/story.md
    agents:
      - references/cards/story.md
      - shared/references/naming-and-clearance.md

  - id: stage-5-industries
    title: Stage 5 — The industries
    session:
      - references/cards/industries.md
    agents:
      - references/cards/industries.md

  - id: stage-5-capabilities
    title: Stage 5 — The capabilities
    session:
      - references/cards/capabilities.md
    agents:
      - references/cards/capabilities.md

  - id: stage-5-workflow
    title: Stage 5 — The workflow
    session:
      - references/cards/workflow.md
    agents:
      - references/cards/workflow.md

  - id: stage-5-architecture
    title: Stage 5 — The architecture
    session:
      - references/cards/architecture.md
    agents:
      - references/cards/architecture.md
      - shared/references/architecture-diagram.md

  - id: stage-5-oracle-products
    title: Stage 5 — The Oracle products
    session:
      - references/cards/oracle-products.md
    agents:
      - references/cards/oracle-products.md

  - id: stage-5-metrics
    title: Stage 5 — The metrics
    session:
      - references/cards/metrics.md
    agents:
      - references/cards/metrics.md

  - id: stage-5-packages
    title: Stage 5 — The packages
    session:
      - references/cards/packages.md
    agents:
      - references/cards/packages.md

  - id: stage-6-brief
    title: Stage 6 — The whole brief
    session:
      - references/cards/brief.md
