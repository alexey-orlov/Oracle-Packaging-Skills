          - { name: Real-time traffic / live travel data, status: roadmap, tier_first_available: scaling }
      - name: Dynamic
        features:
          - { name: Within-day job reassignment, status: roadmap, tier_first_available: scaling }
          - { name: Urgent / emergency request handling, status: roadmap, tier_first_available: scaling }
      - name: Workzone-based rules
        features:
          - { name: Default work zones per technician, status: available, tier_first_available: pov }
          - { name: Work zone-level demand, status: available, tier_first_available: pov }
          - { name: Neighboring workzones, status: available, tier_first_available: integration }
          - { name: Cross-zone allocation of selected technicians, status: partial, tier_first_available: integration }
      - name: Forecast-based rules
        features:
          - name: Forecast-based allocation
            status: available
            tier_first_available: integration
            note: forecast data to be provided by the customer
      - name: Commitment-based rules
        features:
          - { name: Non-movable appointments, status: partial, tier_first_available: pov }
          - { name: Different SLA types per appointment, status: available, tier_first_available: integration }
      - name: Other rules
        features:
