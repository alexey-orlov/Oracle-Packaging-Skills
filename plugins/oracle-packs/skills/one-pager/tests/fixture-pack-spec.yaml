workflow:
  inputs:
    - { system: Oracle Fusion Field Service, data: work orders, technicians, zones }
  steps:
    - { n: 1, name: Load the period's data, actor: system, human_in_the_loop: false,
        failure_path: "Missing fields → row flagged, not dropped; dispatcher resolves" }
    - { n: 2, name: Set the rules, actor: human, human_in_the_loop: true,
        failure_path: "Conflicting hard rules → solver reports the conflict before running" }
    - { n: 3, name: Solve the plan, actor: ai, human_in_the_loop: false,
        failure_path: "No feasible plan → relax soft constraints and report which" }
    - { n: 4, name: Review, approve, measure, actor: human, human_in_the_loop: true,
        failure_path: "Rejected zones return to step 2 with the dispatcher's comment attached" }
  outputs:
    - { system: Oracle Fusion Field Service, data: optimized plan written back }

architecture:
  inputs:
    - system: Oracle Fusion Field Service
      note: field workforce & assignments
      data: technicians data, default allocations
  stack:
    - { layer: Custom configuration, vendor: SoftServe, items: [client rules, constraints, KPI definitions] }
    - { layer: Accelerator business app, vendor: Oracle + SoftServe, name: Accelerator business app,
        note: optimization engine + dispatcher UI }
    - { layer: Optimization engine, vendor: NVIDIA, name: NVIDIA cuOpt, note: GPU-accelerated solver,
        catalog_id: nvidia-cuopt }
    - { layer: Infrastructure, vendor: Oracle Cloud Infrastructure, items: [OCI Dedicated AI cluster] }
  outputs:
    - system: Oracle Fusion Field Service
      data: "optimized allocations: zones, visits"

oracle_products:
  - { id: oracle-fusion-field-service, role: required, why: "Source of work orders and destination of the plan",
      integration: { pov: "file export / import", integration: "API write-back", scaling: "API + telemetry" } }
  - { id: oci-dedicated-ai-cluster, role: required, why: "Runs the optimization engine" }
  - { id: oci-object-storage, role: required, why: "Landing zone for plan inputs and exports" }
  - { id: oci-iam, role: required, why: "Access control for the dispatcher application" }
  - { id: oracle-analytics-cloud, role: optional, why: "Destination for per-plan KPI exports" }

kpis:
  - name: Planning cycle time
    chip_label: Planning cycle time
    direction: down
    formula: Time from demand freeze to an approved plan for one region
    baseline: ~2 days manual
    figure: ~30 min
    figure_status: pov_result
    one_pager_label: "to optimize and approve a region's 4-week plan: down from ~2 days"
    attribution:
      named_when_allowed: "Proof of value · <customer, on clearance>"
      otherwise: proof of value at a global home-appliance manufacturer
    caveat: KPIs measured before/after on proof-of-value data; figures are illustrative, not contractual.
    source: one-pager 2026-07-17
  - name: Productivity gain
    direction: up
    formula: Total jobs ÷ days with at least one job, averaged across technicians
    baseline: current manual plan for the same window
    figure: "+26%"
    figure_prefix: up to
    figure_status: pov_result
    one_pager_label: productivity gain on proof-of-value data across three countries
    attribution:
      named_when_allowed: "Proof of value · <customer, on clearance>"
      otherwise: proof of value at a global home-appliance manufacturer
    caveat: KPIs measured before/after on proof-of-value data; figures are illustrative, not contractual.
    source: one-pager 2026-07-17
  - name: Staffing cost avoided
    direction: down
    formula: Avoided additional technician headcount valued at fully loaded cost
    baseline: planned hiring for the same demand
    figure: "€190K"
    figure_suffix: / month
    figure_status: modeled
    one_pager_label: estimated savings at full launch, valued as the cost of additional staffing avoided
    attribution:
      named_when_allowed: "Proof of value · <customer, on clearance>"
      otherwise: modeled at a global home-appliance manufacturer
    caveat: KPIs measured before/after on proof-of-value data; figures are illustrative, not contractual.
    source: one-pager 2026-07-17

packages:
  tiers:
    - id: pov
      name: PoV Jumpstart
      size_tag: S
      scope_line: >-
        Manual data import, limited rule set: prove the KPI gains on the customer's data.
      duration_weeks: { target: 6, min: 4, max: 8, hard_cap: 10 }
      services_price: { value: 90000, currency: EUR, status: confirmed }
      infra_price_monthly:
        value: 2000
        currency: EUR
        status: indicative
        footnote: Indicative; depends on the usage and optimization rules complexity
      what_you_get: [A measured before/after on the customer's own data, A sandboxed dispatcher UI]
      scope_in: [one region, one rule set, file-based data exchange]
      scope_out: [production integration, multi-region rules]
    - id: integration
      name: Integration
      size_tag: M
      scope_line: >-
        Full setup and integration, live at one location: no manual work, embedded in the workflow.
      duration_weeks: { min: 12, max: 20 }
      services_price: { range: [300000, 500000], currency: EUR, status: indicative }
      infra_price_monthly: { value: 25000, currency: EUR, status: indicative }
      what_you_get: [Live write-back to Oracle Fusion Field Service, Customer rules and weights]
    - id: scaling
      name: Scaling
      size_tag: L
      scope_line: "Scaling across locations: heterogeneous rules and data workflows per region."
      duration_weeks: { min: 12, max: 52 }
      services_price: { status: tbd }
      infra_price_monthly: { status: tbd }

  capability_handling:
    - area: Optimization rules & guardrails
      levels: { pov: partial, integration: included, scaling: advanced }
      pov: Foundational allocation with the recurring, most typical constraints — zones, skills, planned absences
      integration: Advanced allocation with all operational complexities — urgent jobs, crews, SLAs, inventory coupling
      scaling: Multiple region-specific optimization-rule configurations
    - area: Re-optimization & feedback loop
      levels: { pov: none, integration: included, scaling: advanced }
    - area: Analytics & efficiency KPIs
      levels: { pov: included, integration: included, scaling: advanced }
    - area: Oracle Fusion Field Service integration
      pov: "— out of PoV scope; data arrives by file export / import"
      integration: "● In: staff, availability, booking data · Out: allocations · In: factual durations & times"
      scaling: "●● Multi-region write-back with telemetry"
    - area: Additional data sources & BI
      levels: { pov: none, integration: included, scaling: advanced }
      integration: Up to 5 typical integrations — booking, inventory, HR/WFM, demand forecasting, BI
    - area: Deployment
      levels: { pov: partial, integration: included, scaling: advanced }
      pov: Sandboxed
      integration: Enterprise-integrated (dedicated landing zone, IAM, observability)
      scaling: Enterprise-integrated, multi-zone

  why_it_sells_for_the_partner:
    - label: A natural OFS cross-sell
      text: native Oracle Fusion Field Service integration - known endpoints, a warm path into the account
    - label: Net-new OCI consumption
      text: recurring GPU workloads on dedicated OCI clusters, on top of the existing Fusion SaaS seat
    - label: Repeatable
      text: fits any OFS customer with a heavy, centralized dispatch and scheduling routine
  target_oci_consumption: Dedicated AI cluster, 4-8 GPUs, running on each planning cycle

