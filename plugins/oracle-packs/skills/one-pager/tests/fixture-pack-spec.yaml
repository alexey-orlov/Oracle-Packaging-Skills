problem_solution:
  problem: >-
    Field-service operators plan their mobile workforce by hand: work zones, technician
    assignments, dozens of rules and constraints.
  problem_points:
    - label: Suboptimal efficiency
      text: uneven workloads and under-used capacity
    - label: Lower customer satisfaction
      text: longer wait times from suboptimal allocations
    - label: Poor scalability
      text: planning hinges on scarce senior dispatchers; new zones launch slowly
  solution: >-
    NVIDIA cuOpt ingests demand, availability, skills and constraints, and computes the best
    technician-to-zone-to-job plan in minutes. Dispatchers review it on a live map, re-optimize
    and write the plan back to Oracle Fusion Field Service.
  reframe: review the plan, not build it
  source: user:2026-09-18

one_liner:
  full: >-
    Optimizes field-service work zones and schedules with NVIDIA cuOpt: a region's four-week plan
    built in minutes, approved by dispatchers, exported to Oracle Fusion Field Service.
  short: A region's four-week field plan, optimized in minutes and approved by dispatchers.
  banned_words_checked: true
  source: user:2026-09-18
  kpi_chips:
    - { label: Productivity, direction: up }
    - { label: Capacity utilization, direction: up }
    - { label: Customer wait time, direction: down }

icp:
  line: >-
    Field-service operations leaders at companies running Oracle Fusion Field Service with 200+
    technicians.
  buyer_roles: [VP Field Service, COO]
  qualifying_signals: [centralized dispatch team, manual zone planning, seasonal demand spikes]
  disqualifiers: [fewer than 50 technicians, no route or zone constraints]
  source: user:2026-09-18

verticals:
  - name: Appliance & white-goods repair
    framing:
      problem: Home-repair demand swings daily and technicians carry different part sets.
      solution: >-
        Dispatch by skill, spare parts and travel, absorbing urgent call-outs and no-shows
        without re-planning the day.
    what_matters_here: First-visit fix rate and same-day absorption of urgent jobs.
    status: proven
  - name: "Utilities: water, gas, electric"
    framing:
      problem: Planned maintenance competes with outage response across large territories.
      solution: >-
        Schedule crews against SLAs, outage spikes and certifications, balancing planned and
        emergency work.
    what_matters_here: SLA compliance per territory and crew certification coverage.
    status: plausible
  - name: Telecom & cable
    framing:
      problem: Install-and-repair appointments carry tight customer windows.
      solution: >-
        Route technicians to tight appointment windows across regions, matching line skills and
        cutting customer wait time.
    what_matters_here: Appointment-window adherence and repeat-visit rate.
    status: plausible
  - name: Industrial, medical & IT equipment
    framing:
      problem: Contracted equipment uptime is the commercial commitment, not visit count.
      solution: >-
        Allocate asset-based service engineers by skill, SLA and location, keeping high-value
        machines uptime-critical.
    what_matters_here: Contracted uptime per asset class and engineer specialization depth.
    status: plausible

