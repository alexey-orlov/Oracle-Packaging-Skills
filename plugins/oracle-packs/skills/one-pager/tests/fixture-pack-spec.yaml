  - area: Allocation rules
    customization_scope_area:
      - Custom rules implementation
      - Rules configuration
      - Matching rules with source data formats
      - >-
        Balancing optimization function with penalty / rewards, allocation rules weights tuning to
        achieve optimal allocation per customer
      - Introduction of additional optimization objectives
    categories:
      - name: Workforce availability rules
        features:
          - { name: Skill-based allocation, status: available, tier_first_available: pov }
          - { name: Maximal load per day, status: available, tier_first_available: pov }
          - { name: Planned vacation reallocation, status: available, tier_first_available: pov }
          - { name: Same-day sickness handling, status: partial, tier_first_available: integration }
      - name: Distance-based
