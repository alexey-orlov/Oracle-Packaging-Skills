# What /oracle-packs:visuals loads, step by step.
#
# The rule the skill obeys: load only the file(s) listed for the step you are
# on, never the whole folder. `session` files enter the conversation and are
# charged to that step's budget; `agents` files are read by a subagent in its
# own fresh context and are reported, not charged.
#
# Not listed anywhere, on purpose: `references/icon-keywords.yaml`, which
# tools/suggest_icons.py reads. See docs/CONTEXT-BUDGET.md.
#
# Checked by: shared/tools/context_budget.py.

budget:
  tokens_per_word: 1.35
  start_up_tokens: 6000
  step_tokens: 2000

root: ../..                  # the visuals skill folder; `shared/...` resolves to the bundle's shared folder

steps:
  - id: start-up
    title: Before the first message
    start_up: true
    session:
      - SKILL.md
      - ../spec/references/cards/owner-language.md
      - references/cards/manifest.yaml

  - id: icons
    title: The icon for each industry
    session:
      - references/cards/sources.md
      - references/cards/icons.md

  - id: photos
    title: The today and tomorrow photographs
    session:
      - references/cards/sources.md
      - references/cards/photos.md

  - id: customer-logo
    title: The customer's logo
    session:
      - references/cards/customer-logo.md

  - id: record
    title: Recording each choice
    session:
      - references/cards/record.md

  - id: close
    title: What is chosen, and what is still open
    session:
      - references/cards/close.md
      - ../spec/references/cards/save.md           # the spec skill's card; one home, no copy
