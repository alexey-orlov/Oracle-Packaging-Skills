# Read by tools, not by the model: tools/suggest_icons.py loads this file. The runtime card is
# references/cards/icons.md.
#
# Industry -> candidate icons. Read by tools/suggest_icons.py to turn a vertical's name into three
# Tabler icon names worth proposing to the owner.
#
# How a row is matched: every word in `match` is looked for in the lower-cased vertical name (and
# in the vertical's `what_matters_here` line when the tool is given the spec). The rows that match
# are ranked by how specific the matched word is — a two-word phrase beats a single word, and a
# single word beats a substring — and the top rows' icons are proposed in order, de-duplicated.
#
# `icons` is ordered best-first and every name must exist in Tabler's outline set: the tool checks,
# and a name that has gone from the set is reported rather than silently dropped. Verified against
# tabler-icons main on 2026-09-22.
#
# Adding an industry is adding a row. Keep `icons` to three or four: the owner is shown three, and
# the fourth is what "search again" falls back to before a free-text search.

version: 1
verified: 2026-09-22

fallback:
  # Used when nothing matches — deliberately generic, so a miss looks like a miss rather than a
  # confident wrong guess.
  icons: [building, users, target]

industries:

  - id: logistics
    match: [logistics, freight, haulage, shipping, courier, parcel, "supply chain", "last mile", warehouse, distribution]
    icons: [truck, package, building-warehouse, ship]

  - id: rail-transport
    match: [rail, railway, train, transit, "public transport", metro, bus]
    icons: [train, bus, road]

  - id: aviation
    match: [aviation, airline, airport, aerospace, aircraft, flight, "ground handling"]
    icons: [plane, building-airport, plane-departure]

  - id: maritime
