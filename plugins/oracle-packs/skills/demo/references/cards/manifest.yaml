# What /oracle-packs:demo loads, step by step.
#
# The rule the skill obeys: load only the file(s) listed for the step you are
# on, never the whole folder. `session` files enter the conversation and are
# charged to that step's budget; `agents` files are read by a subagent in its
# own fresh context and are reported, not charged.
#
# Not listed anywhere, on purpose: `assets/reference-demo/` and
# `assets/tour-engine.js` are CODE the builder copies and adapts — open the one
# file you are adapting, never the folder, and never into the conversation. The
# long references (`references/demo-data-model.md`, `assets/tour-engine.md`) reach
# a subagent only.
#
# Checked by: shared/tools/context_budget.py (see docs/CONTEXT-BUDGET.md).

budget:
  tokens_per_word: 1.35
  start_up_tokens: 6000
  step_tokens: 2000

root: ../..                  # the demo skill folder; `shared/...` resolves to the plugin's shared folder

steps:
  - id: start-up
    title: Before the first message
    start_up: true
    session:
      - SKILL.md
      - references/cards/owner-language.md
      - references/cards/manifest.yaml

  - id: sources
    title: Ask for the sources
    session:
      - references/cards/sources.md

  - id: flow
    title: Extract the real flow and confirm it
    session:
      - shared/references/anatomy/artifact-demo.md
      - references/cards/flow.md

  - id: design
    title: Design the walkthrough
    session:
      - references/cards/design.md
      - references/cards/word-budgets.md

  - id: data-model
    title: Settle the data model and the figures
    session:
      - references/cards/data-model.md
      - references/cards/synthetic-data.md
    agents:
      - references/demo-data-model.md
      - shared/references/naming-and-clearance.md

  - id: build
    title: Build the four files
    session:
      - references/cards/build.md
      - references/cards/word-budgets.md
    agents:
      - assets/tour-engine.md

  - id: red-team-and-fidelity
    title: Red-team against the spec, then audit fidelity
    session:
      - references/cards/red-team.md

  - id: qa-and-lint
    title: Scripted click-through, captures and lint
    session:
      - references/cards/qa.md

  - id: review-pack
    title: Show it to the owner
    session:
      - references/cards/review-pack.md

  - id: handoff
    title: Hand the frames and the URLs to the listing
    session:
      - references/cards/handoff.md
