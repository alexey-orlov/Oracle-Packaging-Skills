# The shared icon library — which picture stands for which kind of business.
#
# One library for every artifact that needs a pictogram: the sales deck's
# verticals slide reads it today; the one-pager and the mini-site listing read
# the same files, so an industry looks the same wherever it appears.
#
# House style: white line art on a transparent ground, 480x480 PNG, ~24 px
# stroke, no fill — lifted from the reference deck's own icons and matched by
# everything drawn since. A new icon that does not match that style does not
# belong here.
#
# Matching: the caller lower-cases the thing being named (a vertical's name, an
# industry) and tests each entry's keywords as substrings, longest keyword
# first. First hit wins; nothing matches -> `fallback`, and the caller says
# which name went unmatched so a person can pick the right icon.
#
# Rows carry `source` and `license` because the files come from different
# places: the reference deck's own artwork, icons drawn here, and — later —
# icons pulled from open sets. Keep both fields filled on every row added.

fallback: generic.png

icons:
  - file: washing-machine.png
    depicts: a front-loading washing machine
    source: reference deck, slide 3
    license: SoftServe artwork, internal use
    keywords: [white-goods, white goods, appliance, home repair, in-home,
               residential, consumer electronics, domestic]

